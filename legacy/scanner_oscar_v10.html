<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0e17" />
<title>Blackzeldon Scanner — Oscar v10.1 (Pro)</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:
  radial-gradient(ellipse 120% 60% at 50% -10%,#16233d 0%,#0a0e17 45%,#05070d 100%),
  repeating-linear-gradient(0deg, rgba(34,211,238,.035) 0px, rgba(34,211,238,.035) 1px, transparent 1px, transparent 28px),
  repeating-linear-gradient(90deg, rgba(34,211,238,.035) 0px, rgba(34,211,238,.035) 1px, transparent 1px, transparent 28px);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e6edf3;overscroll-behavior:none;}
#root{min-height:100vh;padding:10px 12px 100px;max-width:500px;margin:0 auto;}
button{min-height:40px;cursor:pointer;touch-action:manipulation;}
input{font-size:16px!important;touch-action:manipulation;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#1f2937;border-radius:3px;}
.details{background:#0a0e17;border-radius:8px;padding:8px;margin-top:6px;}
.details summary{font-size:11px;color:#22d3ee;cursor:pointer;padding:4px;border-radius:4px;background:#1f293733;}
.details summary:hover{background:#1f2937;}
.news-item{padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:11px;border-left:3px solid;}
.stat-box{background:#1f2937;border-radius:8px;padding:8px;text-align:center;flex:1;}
.stat-value{font-size:20px;font-weight:700;}
.journal-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid #1f2937;font-size:12px;}
.journal-item .pair{font-weight:600;width:70px;}
.journal-item .tf{width:50px;color:#8b949e;}
.journal-item .price{width:80px;font-family:monospace;}
.journal-item .result{width:60px;font-weight:700;}
.journal-item .result.win{color:#22c55e;}
.journal-item .result.loss{color:#ef4444;}
.journal-item .result.pending{color:#eab308;}
.journal-item .result.expired{color:#8b949e;}
.request-status{background:#1f2937;border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:11px;display:flex;flex-wrap:wrap;gap:4px;}
.request-status .item{background:#0a0e17;border-radius:4px;padding:3px 8px;border-left:3px solid;display:flex;align-items:center;gap:6px;}
.request-status .item .label{color:#8b949e;}
.request-status .item .status{font-weight:600;}
.request-status .item .status.pending{color:#eab308;}
.request-status .item .status.running{color:#22d3ee;}
.request-status .item .status.done{color:#22c55e;}
.request-status .item .status.error{color:#ef4444;}
.request-status .item .timer{color:#8b949e;font-family:monospace;}
.quality-tag{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;}
.equity-chart{background:#0a0e17;border-radius:8px;padding:8px;margin-top:6px;border:1px solid #1f2937;height:120px;display:flex;align-items:flex-end;gap:2px;overflow:hidden;}
.equity-bar{flex:1;min-height:2px;border-radius:1px;transition:height 0.3s;}
button{transition:transform .1s ease, box-shadow .1s ease;}
button:active{transform:scale(.95);}
@keyframes shimmer-sweep{0%{transform:translateX(-100%);}100%{transform:translateX(250%);}}
.shimmer-bar{position:relative;overflow:hidden;}
.shimmer-bar::after{content:"";position:absolute;top:0;left:0;height:100%;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:shimmer-sweep 2.2s ease-in-out infinite;}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}
@keyframes pulse-live{0%{box-shadow:0 0 0 0 rgba(139,92,246,.55);}70%{box-shadow:0 0 0 7px rgba(139,92,246,0);}100%{box-shadow:0 0 0 0 rgba(139,92,246,0);}}
.live-dot{width:7px;height:7px;border-radius:50%;display:inline-block;animation:pulse-live 1.4s infinite;flex-shrink:0;}
@keyframes float-logo{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-2px) rotate(-4deg);}}
.logo-float{animation:float-logo 3s ease-in-out infinite;display:inline-block;}
@keyframes bounce-arrow-up{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes bounce-arrow-down{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
.arrow-bull{display:inline-block;animation:bounce-arrow-up 1.1s ease-in-out infinite;}
.arrow-bear{display:inline-block;animation:bounce-arrow-down 1.1s ease-in-out infinite;}
@keyframes spin-slow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.amd-spin{display:inline-block;animation:spin-slow 4s linear infinite;}
@keyframes aura-spin{0%{transform:translate(-50%,-50%) rotate(0deg);}100%{transform:translate(-50%,-50%) rotate(360deg);}}
.core-aura{position:absolute;top:50%;left:50%;width:54px;height:54px;border-radius:50%;background:conic-gradient(from 0deg,#22d3ee,#8b5cf6,#22d3ee,#8b5cf6,#22d3ee);filter:blur(9px);opacity:.5;animation:aura-spin 5s linear infinite;z-index:0;}
@keyframes text-flow{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
.flow-text{background-size:220% auto;animation:text-flow 3.2s linear infinite;}
@keyframes shimmer-excellent{0%,100%{opacity:1;filter:drop-shadow(0 0 2px currentColor);}50%{opacity:.7;filter:drop-shadow(0 0 8px currentColor);}}
.quality-excellent{animation:shimmer-excellent 1.6s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}
.news-flash{display:inline-block;animation:wiggle 2s ease-in-out infinite;}
@keyframes flash-in{0%{transform:scale(1.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
.score-flash{animation:flash-in .35s ease-out;}
@keyframes core-pulse{0%,100%{box-shadow:0 0 8px 0 rgba(34,211,238,.35),inset 0 0 6px rgba(34,211,238,.25);}50%{box-shadow:0 0 16px 3px rgba(34,211,238,.55),inset 0 0 10px rgba(34,211,238,.4);}}
.nano-core{clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);animation:core-pulse 2.4s ease-in-out infinite;}
@keyframes scanline-sweep{0%{transform:translateY(-8px);opacity:0;}15%{opacity:.7;}85%{opacity:.7;}100%{transform:translateY(58px);opacity:0;}}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.9),transparent);pointer-events:none;animation:scanline-sweep 3.2s linear infinite;}
.confidence-detail{font-size:11px;color:#8b949e;padding:6px 8px;background:#0a0e17;border-radius:6px;margin-top:4px;line-height:1.6;border-left:3px solid;}
.market-closed-banner{background:rgba(239,68,68,.1);border:1px solid #ef444455;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#ef4444;display:flex;align-items:center;gap:8px;}

/* ====== PREMIUM UI v11 (ajout non destructif) ====== */
@keyframes tf-sheen{0%{transform:translateX(-120%);}100%{transform:translateX(220%);}}
@keyframes tf-glow{0%,100%{box-shadow:0 0 0 1px rgba(233,185,78,.55),0 6px 18px -6px rgba(233,185,78,.55);}50%{box-shadow:0 0 0 1px rgba(233,185,78,.9),0 10px 26px -6px rgba(233,185,78,.8);}}
.tf-btn{flex:1;position:relative;overflow:hidden;padding:9px 4px 8px;border-radius:13px;border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px -8px #000;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .2s,background .25s,box-shadow .25s;}
.tf-btn:active{transform:scale(.94);}
.tf-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);}
.tf-btn.is-active{border-color:rgba(233,185,78,.75);
  background:linear-gradient(180deg,rgba(233,185,78,.22),rgba(233,185,78,.05) 60%,rgba(139,92,246,.10));
  animation:tf-glow 2.6s ease-in-out infinite;transform:translateY(-1px);}
.tf-btn.is-active::before{animation:tf-sheen 2.4s ease-in-out infinite;}
.tf-btn .tf-label{font-size:13.5px;font-weight:800;letter-spacing:.03em;line-height:1;}
.tf-btn.is-active .tf-label{background:linear-gradient(92deg,#ffe9a8,#e9b94e 45%,#fff3c4);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tf-btn .tf-role{font-size:7.5px;letter-spacing:.09em;text-transform:uppercase;color:#8b949e;margin-top:2px;}
.tf-btn .tf-bar{position:absolute;left:8px;right:8px;bottom:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;}
.tf-btn .tf-bar span{display:block;height:100%;border-radius:2px;transition:width .5s cubic-bezier(.22,1,.36,1);}
.tf-hot{position:absolute;top:3px;left:4px;font-size:8px;filter:drop-shadow(0 0 4px #f59e0b);}
/* Chart premium */
.tvx{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.07);
  background:radial-gradient(120% 100% at 50% 0%,#101a2c 0%,#0a0e17 60%,#070a11 100%);
  box-shadow:0 18px 40px -24px #000,inset 0 1px 0 rgba(255,255,255,.05);}
.tvx canvas{display:block;width:100%;}
.tvx-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);}
.tvx-chip{font-size:9px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:999px;border:1px solid;text-transform:uppercase;}
.tvx-legend{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px;border-top:1px solid rgba(255,255,255,.05);}
.tvx-legend div{font-size:9.5px;font-weight:600;display:flex;align-items:center;gap:4px;color:#8b949e;}
.tvx-legend i{width:12px;height:2px;border-radius:2px;display:inline-block;}
.qx-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.qx-cell{position:relative;overflow:hidden;padding:8px 9px;border-radius:12px;border:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01));}
.qx-cell .k{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:#8b949e;}
.qx-cell .v{font-size:15px;font-weight:800;font-family:ui-monospace,monospace;margin-top:2px;}
.qx-cell .d{font-size:9px;color:#6e7a8a;margin-top:1px;line-height:1.35;}
.qx-ring{position:relative;width:74px;height:74px;flex-shrink:0;}

/* ====== SÉLECTEUR DE PAIRES PREMIUM v11.1 (ajout) ====== */
@keyframes pair-sheen{0%{transform:translateX(-130%);}100%{transform:translateX(240%);}}
@keyframes pair-halo{0%,100%{opacity:.55;}50%{opacity:1;}}
.pair-rail{position:relative;}
.pair-rail::after{content:"";position:absolute;top:0;right:0;bottom:0;width:26px;pointer-events:none;
  background:linear-gradient(90deg,rgba(10,14,23,0),rgba(10,14,23,.92));border-radius:0 12px 12px 0;}
.pair-btn{flex-shrink:0;position:relative;overflow:hidden;padding:9px 13px 11px;border-radius:14px;
  border:1px solid rgba(255,255,255,.07);color:#e6edf3;cursor:pointer;text-align:left;min-width:96px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 14px -10px #000;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .2s,background .25s,box-shadow .25s;}
.pair-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.16);}
.pair-btn:active{transform:scale(.95);}
.pair-btn::before{content:"";position:absolute;inset:0;transform:translateX(-130%);
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);}
.pair-btn.is-active{transform:translateY(-2px);}
.pair-btn.is-active::before{animation:pair-sheen 2.6s ease-in-out infinite;}
.pair-btn .pair-top{display:flex;align-items:center;gap:5px;line-height:1;}
.pair-btn .pair-ico{font-size:13px;filter:drop-shadow(0 0 6px currentColor);}
.pair-btn .pair-name{font-size:12.5px;font-weight:800;letter-spacing:.02em;}
.pair-btn .pair-sub{margin-top:3px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#7d8896;}
.pair-btn.is-active .pair-sub{color:rgba(255,255,255,.72);}
.pair-btn .pair-halo{position:absolute;inset:-40% -30% auto -30%;height:120%;border-radius:50%;
  filter:blur(18px);opacity:0;transition:opacity .3s;pointer-events:none;}
.pair-btn.is-active .pair-halo{animation:pair-halo 2.8s ease-in-out infinite;}
.pair-btn .pair-bar{position:absolute;left:9px;right:9px;bottom:4px;height:2px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;}
.pair-btn .pair-bar span{display:block;height:100%;border-radius:2px;transition:width .6s cubic-bezier(.22,1,.36,1);}
.pair-star{position:absolute;top:3px;right:5px;font-size:9px;filter:drop-shadow(0 0 5px #eab308);}

/* ===== Chips de paires — langage visuel volontairement DIFFÉRENT des touches TF :
   rail vertical coloré à gauche, ticker monospace, cadran de score à droite,
   coin biseauté facon "ticket de bourse". ===== */
.pair-chip{flex-shrink:0;position:relative;display:flex;align-items:center;gap:9px;
  padding:8px 10px 8px 12px;min-width:132px;cursor:pointer;overflow:hidden;
  border:1px solid rgba(255,255,255,.07);background:linear-gradient(135deg,rgba(22,27,34,.92),rgba(10,14,23,.92));
  border-radius:10px 16px 10px 16px;color:#e6edf3;
  transition:transform .18s cubic-bezier(.22,1,.36,1),border-color .2s,box-shadow .25s;}
.pair-chip:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.15);}
.pair-chip:active{transform:scale(.97);}
.pair-chip .rail{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;opacity:.55;transition:opacity .2s,box-shadow .2s;}
.pair-chip.is-active .rail{opacity:1;}
.pair-chip .tick{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;font-weight:800;letter-spacing:.04em;line-height:1;}
.pair-chip .meta{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#6f7d8c;}
.pair-chip .meta i{width:4px;height:4px;border-radius:50%;display:inline-block;font-style:normal;}
.pair-chip.is-active .meta{color:rgba(255,255,255,.62);}
.pair-chip .dial{position:relative;margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;font-weight:800;color:#c9d1d9;background:conic-gradient(var(--dc,#22d3ee) calc(var(--v,0%) * 1),rgba(255,255,255,.07) 0);}
.pair-chip .dial::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0c111a;}
.pair-chip .dial span{position:relative;z-index:1;}
.pair-chip.is-active{box-shadow:0 10px 26px -16px currentColor;}
.pair-chip .flag{position:absolute;top:-1px;right:-1px;font-size:8px;padding:2px 5px 3px;border-radius:0 14px 0 8px;
  background:linear-gradient(135deg,#eab308,#f59e0b);color:#0a0e17;font-weight:800;}
.pair-chip .beam{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.13) 50%,transparent 65%);
  transform:translateX(-120%);}
.pair-chip.is-active .beam{animation:chip-beam 3.4s ease-in-out infinite;}
@keyframes chip-beam{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}

/* ===== Monte-Carlo & OB retest (Quantum Edge) ===== */
.qx-mc{margin:8px 0;padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:rgba(10,14,23,.6);}
.qx-mc-head{display:flex;align-items:center;gap:6px;font-size:9.5px;color:#8b949e;margin-bottom:6px;letter-spacing:.03em;}
.qx-mc-bar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.05);}
.qx-mc-bar span{display:block;height:100%;transition:width .7s cubic-bezier(.22,1,.36,1);}
.qx-mc-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:9.5px;font-weight:700;}
.qx-ob{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;margin-bottom:8px;
  border:1px solid rgba(234,179,8,.25);background:linear-gradient(120deg,rgba(234,179,8,.09),transparent 70%);}
.qx-ob-ico{font-size:16px;}
.qx-ob-dial{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#e6edf3;
  background:conic-gradient(#eab308 var(--v,0%),rgba(255,255,255,.07) 0);position:relative;}
.qx-ob-dial::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#0c111a;}
.qx-ob-dial{isolation:isolate;} .qx-ob-dial>*{position:relative;z-index:1;}

/* ===== Bandeau position simulée du graphique ===== */
.tvx-pos{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 10px;margin:0 0 4px;
  font-size:10px;color:#8b949e;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);
  background:rgba(255,255,255,.015);}
.tvx-pos-tag{font-size:9px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:20px;border:1px solid;}
.tvx-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#c9d1d9;border-radius:7px;
  width:24px;height:22px;font-size:12px;font-weight:700;line-height:1;cursor:pointer;transition:.15s;padding:0;}
.tvx-btn:hover{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.45);color:#22d3ee;}
.tvx-hud{display:flex;flex-wrap:wrap;gap:10px;padding:5px 10px;font-size:10px;color:#8b949e;font-family:ui-monospace,monospace;
  background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05);}
.tvx-hud b{color:#e6edf3;}
/* ---- Checklist d'entrée ---- */
.bz-ck{border:1px solid rgba(139,92,246,.45);border-radius:14px;padding:12px;margin-bottom:10px;
  background:linear-gradient(150deg,rgba(139,92,246,.10),rgba(13,17,23,.65));}
.bz-ck-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px;font-size:12.5px;color:#e6edf3;line-height:1.5;}
.bz-ck-row .ic{font-size:14px;line-height:1.2;}
.bz-ck-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.bz-ck-tag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid;}
.bz-select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:#e6edf3;
  border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:8px;}
/* ---- Laboratoire ---- */
.bz-tabs{display:flex;gap:6px;margin:0 0 10px;}
.bz-tab{flex:1;padding:9px 6px;border-radius:12px;font-size:11.5px;font-weight:800;letter-spacing:.04em;cursor:pointer;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#8b949e;text-align:center;transition:.18s;}
.bz-tab.on{color:#05070d;background:linear-gradient(135deg,#22d3ee,#8b5cf6);border-color:transparent;
  box-shadow:0 6px 18px -8px rgba(34,211,238,.8);}
.bz-lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.bz-lab-in{display:flex;flex-direction:column;gap:4px;}
.bz-lab-in label{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#8b949e;font-weight:700;}
.bz-lab-in input,.bz-lab-in select{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
  color:#e6edf3;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;font-family:ui-monospace,monospace;}
.bz-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bz-out div{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:9px 10px;}
.bz-out span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#8b949e;font-weight:700;}
.bz-out b{font-size:15px;font-family:ui-monospace,monospace;}
.bz-refresh{display:inline-flex;align-items:center;gap:5px;margin-left:auto;font-size:10px;font-weight:700;cursor:pointer;
  padding:4px 10px;border-radius:20px;color:#22d3ee;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.08);
  transition:transform .15s,box-shadow .2s;}
.bz-refresh:hover{box-shadow:0 0 14px rgba(34,211,238,.25);}
.bz-refresh:active{transform:scale(.94);}
.bz-refresh.spin span{display:inline-block;animation:bz-spin .8s linear infinite;}
@keyframes bz-spin{to{transform:rotate(360deg)}}

<div id="root">
  <div id="preload-indicator" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0e17;color:#e6edf3;font-family:-apple-system,sans-serif;text-align:center;padding:20px;">

<script>
// Filet de sécurité indépendant de React/ReactDOM — si l'app n'a pas
// pris le relais après 8s (CDN lent, erreur JS silencieuse, etc.), on
// remplace le spinner par un message clair + un bouton pour recharger,
// au lieu d'un écran vide qui donne l'impression que l'app est cassée.
// On se fie à un drapeau posé au montage de React (window.__BZ_MOUNTED) :
// compter les enfants de #root était faux, puisque React monte lui aussi
// un unique enfant — le filet pouvait donc se déclencher sur une app saine.
window.__BZ_MOUNTED = false;

// ---- PERSISTANCE DURABLE ----------------------------------------------
// Le navigateur mobile purge parfois le localStorage d'un onglet (mode
// économie de données, stockage partitionné, nettoyage auto). Résultat :
// le compte démo, le journal et l'historique du bot repartaient de zéro à
// chaque nouvelle connexion. On maintient donc un miroir IndexedDB (bien
// plus durable) de toutes les clés "blackzeldon_*", et on restaure
// automatiquement au démarrage si le localStorage a été vidé.
(function(){
  try {
    var P = 'blackzeldon_';
    var origSet = localStorage.setItem.bind(localStorage);
    var origRem = localStorage.removeItem.bind(localStorage);
    window.__BZ_IDB = new Promise(function(res){
      try {
        var r = indexedDB.open('blackzeldon_store', 1);
        r.onupgradeneeded = function(){ try { r.result.createObjectStore('kv'); } catch(e){} };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ res(null); };
      } catch(e) { res(null); }
    });
    function mirror(k, v){
      window.__BZ_IDB.then(function(db){
        if (!db) return;
        try { db.transaction('kv','readwrite').objectStore('kv').put(v, k); } catch(e){}
      });
    }
    localStorage.setItem = function(k, v){
      try { origSet(k, v); } catch(e){}
      if (String(k).indexOf(P) === 0) mirror(k, String(v));
    };
    localStorage.removeItem = function(k){
      try { origRem(k); } catch(e){}
      if (String(k).indexOf(P) === 0) window.__BZ_IDB.then(function(db){
        if (!db) return;
        try { db.transaction('kv','readwrite').objectStore('kv').delete(k); } catch(e){}
      });
    };
    window.__BZ_IDB.then(function(db){
      if (!db) return;
      try {
        var req = db.transaction('kv','readonly').objectStore('kv').getAllKeys();
        req.onsuccess = function(){
          var keys = req.result || [];
          var missing = keys.filter(function(k){ return localStorage.getItem(k) === null; });
          if (!missing.length) return;
          var done = 0, restored = 0;
          missing.forEach(function(k){
            var g = db.transaction('kv','readonly').objectStore('kv').get(k);
            g.onsuccess = function(){
              if (typeof g.result === 'string') { try { origSet(k, g.result); restored++; } catch(e){} }
              if (++done === missing.length && restored && !sessionStorage.getItem('bz_restored')) {
                try { sessionStorage.setItem('bz_restored','1'); } catch(e){}
                location.reload();
              }
            };
            g.onerror = function(){ done++; };
          });
        };
      } catch(e){}
    });
  } catch(e){}
})();

setTimeout(function() {
  var el = document.getElementById('preload-indicator');
  if (el && !window.__BZ_MOUNTED) {
    el.innerHTML = '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
      '<div style="font-size:14px;color:#eab308;margin-bottom:14px;">Le chargement prend plus de temps que prévu<br><span style="font-size:11px;color:#8b949e;">(réseau lent ou ressource externe qui ne répond pas)</span></div>' +
      '<button onclick="location.reload()" style="background:#22d3ee;color:#0a0e17;border:none;border-radius:8px;padding:10px 20px;font-weight:700;font-size:13px;">🔄 Recharger la page</button>';
  }
}, 8000);
</script>

    // ============================================================

    // ============================================================
    function getForexMarketStatus(nowDate) {
      const day = nowDate.getUTCDay(); // 0=dimanche ... 5=vendredi, 6=samedi
      const hour = nowDate.getUTCHours();
      const isOpen = !(day === 6 || (day === 0 && hour < 22) || (day === 5 && hour >= 22));
      let nextOpen = null;
      if (!isOpen) {
        nextOpen = new Date(Date.UTC(nowDate.getUTCFullYear(), nowDate.getUTCMonth(), nowDate.getUTCDate(), 22, 0, 0));
        if (day === 5) nextOpen.setUTCDate(nextOpen.getUTCDate() + 2);
        else if (day === 6) nextOpen.setUTCDate(nextOpen.getUTCDate() + 1);

          const ws = new WebSocket(DERIV_WS_URL);

          ws.onopen = () => {
            clearTimeout(failTimer);
            derivSocket = ws;

      });

      if (!DERIV_LISTENERS[symbol]) DERIV_LISTENERS[symbol] = [];
      DERIV_LISTENERS[symbol].push(callback);
      subscribeDerivTicks(symbol);
      return () => { DERIV_LISTENERS[symbol] = (DERIV_LISTENERS[symbol] || []).filter(fn => fn !== callback); };
    }

    function resampleWeekly(daily) {
      const weeks = {};
      daily.forEach(c => {
        const d = new Date(c.time);
        const year = d.getUTCFullYear();
        const firstJan = new Date(Date.UTC(year, 0, 1));
        const week = Math.ceil((((d - firstJan) / 86400000) + firstJan.getUTCDay() + 1) / 7);
        const wk = year + "-W" + week;
        if (!weeks[wk]) weeks[wk] = { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close, volume: 0 };
        else { weeks[wk].high = Math.max(weeks[wk].high, c.high); weeks[wk].low = Math.min(weeks[wk].low, c.low); weeks[wk].close = c.close; }
      });
      return Object.values(weeks);
    }

    // Symboles Deriv confirmés invalides par l'API elle-même (pas un simple
    // timeout réseau) — on arrête de les redemander pendant 1h au lieu de
    // marteler la même erreur à chaque cycle de scan.
    const DERIV_INVALID_SYMBOLS = {};
    const DERIV_INVALID_COOLDOWN_MS = 3600000;

    async function fetchDerivCandles(symbol, interval, outputsize, cacheSec) {
      const key = symbol + "_" + interval;
      const cached = getCache(key);
      if (cached) return cached;
      if (DERIV_INVALID_SYMBOLS[symbol] && (Date.now() - DERIV_INVALID_SYMBOLS[symbol]) < DERIV_INVALID_COOLDOWN_MS) {
        throw new Error("Symbole désactivé temporairement (invalide confirmé par Deriv)");
      }
      const granularity = DERIV_GRANULARITY[interval] || 60;
      const ws = await getDerivSocket();
      const reqId = Math.floor(Math.random() * 1e9);
      const rawCandles = await new Promise((resolve, reject) => {
        const handler = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.req_id === reqId) {
              ws.removeEventListener("message", handler);
              clearTimeout(timeoutId);
              if (data.error) {
                if (data.error.code === "InvalidSymbol" || /invalid/i.test(data.error.message || "")) {
                  DERIV_INVALID_SYMBOLS[symbol] = Date.now();
                }
                reject(new Error(data.error.message));
              }
              else resolve((data.candles) || []);
            }
          } catch(e) {}
        };
        const timeoutId = setTimeout(() => { ws.removeEventListener("message", handler); reject(new Error("Timeout Deriv")); }, 15000);
        ws.addEventListener("message", handler);
        ws.send(JSON.stringify({
          ticks_history: symbol,
          adjust_start_time: 1,
          count: interval === "1week" ? Math.min(outputsize * 7, 5000) : outputsize,
          end: "latest",
          style: "candles",
          granularity,
          req_id: reqId
        }));
      });
      let candles = rawCandles.map(c => ({
        time: new Date(c.epoch * 1000).toISOString(),
        open: parseFloat(c.open), high: parseFloat(c.high), low: parseFloat(c.low), close: parseFloat(c.close), volume: 0
      }));
      if (interval === "1week") candles = resampleWeekly(candles);
      setCache(key, candles, cacheSec);
      subscribeDerivTicks(symbol); // active le flux temps réel pour l'effet "live"
      return candles;
    }

    // ---- FONCTIONS UTILES ----
    function fmtTime(d) {
      try { return new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: LOME }).format(d); }
      catch(e) { return d.toLocaleTimeString("fr-FR"); }
    }
    function fmtHM(d) {
      try { return new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: LOME }).format(d); }
      catch(e) { return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
    }
    function lomeMin(d) {
      try {
        const p = new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: LOME }).formatToParts(d);
        return parseInt(p.find(x => x.type === "hour").value) * 60 + parseInt(p.find(x => x.type === "minute").value);
      } catch(e) { return d.getHours() * 60 + d.getMinutes(); }
    }
    function activeKZ(m) {
      return KZ.find(k => m >= k.start && m < k.end) || null;
    }
    function isCrypto(pair) { return pair && pair.type === 'crypto'; }
    function isSynthetic(pair) { return pair && pair.type === 'synthetic'; }

    // Hook: abonnement au flux de ticks Deriv en temps réel pour l'effet "live pulse"
    function useDerivLiveTick(pair) {
      const [tick, setTick] = useState(null);
      useEffect(() => {
        if (!pair || pair.type !== 'synthetic') { setTick(null); return; }
        const symbol = pair.symbol;
        if (DERIV_LIVE[symbol]) setTick(DERIV_LIVE[symbol]);
        const unsubscribe = onDerivTick(symbol, (t) => setTick({ price: t.quote, epoch: t.epoch }));
        return unsubscribe;
      }, [pair && pair.symbol]);
      return tick;
    }
    function activeKZForPair(m, pair, refDate) {
      if (isCrypto(pair) || isSynthetic(pair)) return null;
      // Les kill zones (London/NY/Asie) n'existent que quand le marché forex
      // est réellement ouvert — avant, seule l'heure de la journée était
      // vérifiée, jamais le jour, donc "London" pouvait s'afficher actif
      // un samedi matin puisque 8h-10h tombe dans la bonne plage horaire.
      const d = refDate || new Date();
      if (!getForexMarketStatus(d).isOpen) return null;
      return activeKZ(m);
    }

    // ---- CACHE ----
    const CACHE = {};
    function getCache(key) {
      const entry = CACHE[key];
      if (entry && entry.ts && entry.data && (Date.now() - entry.ts) < entry.ttl * 1000) return entry.data;
      return null;
    }
    function setCache(key, data, ttl) { CACHE[key] = { ts: Date.now(), data, ttl }; }
    setInterval(() => {
      const now = Date.now();
      for (const k in CACHE) if (now - CACHE[k].ts > CACHE[k].ttl * 1000) delete CACHE[k];
    }, 60000);

    // ---- FILE D'ATTENTE ----
    let REQUEST_QUEUE = [];
    let IS_PROCESSING = false;
    let LAST_REQUEST_TIME = 0;
    const MIN_REQUEST_INTERVAL = 6000;
    const RATE_LIMIT_WAIT = 12000;

    // ============================================================
    //  LIMITEUR PROACTIF — Twelve Data free tier = 8 appels/min max.
    //  On se limite nous-même à 7/min pour ne JAMAIS déclencher de 429,
    //  au lieu d'attendre l'erreur puis de faire un backoff (plus lent).
    // ============================================================
    const LIVE_API_MAX_PER_MIN = 7;
    const liveApiCallTimestamps = [];
    async function waitForApiSlot(signal) {
      while (true) {
        const now = Date.now();
        while (liveApiCallTimestamps.length && now - liveApiCallTimestamps[0] > 60000) liveApiCallTimestamps.shift();
        if (liveApiCallTimestamps.length < LIVE_API_MAX_PER_MIN) { liveApiCallTimestamps.push(now); return; }
        const waitMs = Math.max(250, 60000 - (now - liveApiCallTimestamps[0]) + 50);
        await new Promise(r => setTimeout(r, waitMs));
        if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
      }
    }
    const IN_FLIGHT = new Set();
    let PRIORITY_IN_FLIGHT = 0;
    const MAX_PRIORITY_CONCURRENT = 2;
    let REQUEST_SEQUENCE = 0;
    const REQUEST_STATUS = {};
    let STATUS_LISTENERS = [];

    function setRequestStatus(key, status, message, seq) {
      REQUEST_STATUS[key] = { status, message, timestamp: Date.now(), seq: seq || 0 };
      STATUS_LISTENERS.forEach(fn => fn(REQUEST_STATUS));
    }
    function subscribeStatus(fn) {
      STATUS_LISTENERS.push(fn);
      return () => { STATUS_LISTENERS = STATUS_LISTENERS.filter(f => f !== fn); };
    }
    function clearRequestStatus(key) { delete REQUEST_STATUS[key]; STATUS_LISTENERS.forEach(fn => fn(REQUEST_STATUS)); }

    function processQueue() {
      if (IS_PROCESSING || REQUEST_QUEUE.length === 0) return;
      const now = Date.now();
      const timeSinceLast = now - LAST_REQUEST_TIME;
      if (timeSinceLast < MIN_REQUEST_INTERVAL) {
        setTimeout(processQueue, MIN_REQUEST_INTERVAL - timeSinceLast);
        return;
      }
      IS_PROCESSING = true;
      const task = REQUEST_QUEUE.shift();
      LAST_REQUEST_TIME = Date.now();
      task().finally(() => { IS_PROCESSING = false; processQueue(); });
    }
    function enqueueRequest(fn) {
      return new Promise((resolve, reject) => {
        const seq = REQUEST_SEQUENCE++;
        REQUEST_QUEUE.push(async () => {
          try { const result = await fn(); resolve(result); }
          catch (e) { reject(e); }
        });
        processQueue();
      });
    }
    function clearQueue() { REQUEST_QUEUE = []; IN_FLIGHT.clear(); }

    // ============================================================
    //  BLOB data.json PARTAGÉ — 1 seul téléchargement pour TOUTES
    //  les paires/TF au lieu d'un fetch par appel (gros gain de vitesse).
    //  + jsDelivr (CDN edge, plus rapide que raw.githubusercontent)
    //  + localStorage : rendu instantané au démarrage (stale-while-revalidate)
    // ============================================================
    const DATA_JSON_URLS = [
      'https://cdn.jsdelivr.net/gh/frankensteinamekoudi-wq/Blackscanner-live@main/data.json',
      'https://raw.githubusercontent.com/frankensteinamekoudi-wq/Blackscanner-live/main/data.json'
    ];
    const DATA_JSON_LS_KEY = 'blackzeldon_datajson_cache_v1';
    const DATA_JSON_TTL_MS = 30000; // ne re-télécharge pas le blob plus d'1x/30s
    let dataJsonBlob = null;
    let dataJsonBlobTs = 0;
    let dataJsonInFlight = null;

    // ============================================================
    //  V13.1 — FLUX SERVEUR SANS CLÉ (/api/public/bz/live)
    //  Données de marché réelles servies par notre propre backend :
    //  le scanner se charge vraiment même sans clé Twelve Data.
    // ============================================================
    const SERVER_FEED_URL = '/api/public/bz/live';
    const SERVER_FEED_UNSUPPORTED = new Set();
    async function fetchServerCandles(symbol, interval, outputsize) {
      if (SERVER_FEED_UNSUPPORTED.has(symbol)) return null;
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 12000);
      try {
        const u = SERVER_FEED_URL + '?symbol=' + encodeURIComponent(symbol) +
          '&interval=' + encodeURIComponent(interval) + '&outputsize=' + (outputsize || 120);
        const res = await fetch(u, { signal: ctrl.signal, cache: 'no-store' });
        if (res.status === 404) { SERVER_FEED_UNSUPPORTED.add(symbol); return null; }
        if (!res.ok) return null;
        const json = await res.json();
        if (!json || !Array.isArray(json.candles) || json.candles.length === 0) return null;
        return json.candles;
      } catch (e) {
        return null;
      } finally {
        clearTimeout(t);
      }
    }

    function loadDataJsonFromLocalStorage() {
      try {
        const raw = localStorage.getItem(DATA_JSON_LS_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed;
      } catch(e) { return null; }
    }
    function saveDataJsonToLocalStorage(data) {
      try { localStorage.setItem(DATA_JSON_LS_KEY, JSON.stringify(data)); } catch(e) {}
    }

    async function getDataJsonBlob(signal) {
      if (dataJsonBlob && (Date.now() - dataJsonBlobTs) < DATA_JSON_TTL_MS) return dataJsonBlob;
      if (dataJsonInFlight) return dataJsonInFlight;
      // BUG CRITIQUE CORRIGÉ : ce blob est partagé par TOUS les appelants
      // (loadCurrent, loadTFRadar, loadTopPick, scanMarket...), mais le fetch
      // sous-jacent utilisait le signal d'annulation du PREMIER appelant venu.
      // Résultat : si loadCurrent annulait sa propre requête (changement de
      // paire, kill zone, etc.), ça tuait le fetch partagé pour TOUT LE MONDE,
      // y compris loadTFRadar dont le signal n'était jamais annulé — d'où le
      // radar qui semblait bloqué/"galérer" pile après un rechargement de
      // loadCurrent. Le fetch partagé utilise maintenant son propre contrôleur
      // interne (timeout 12s), totalement indépendant du signal de chaque appelant.
      dataJsonInFlight = (async () => {
        for (const url of DATA_JSON_URLS) {
          try {
            const internalController = new AbortController();
            const timeoutId = setTimeout(() => internalController.abort(), 12000);
            const resp = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { signal: internalController.signal, cache: 'no-cache' });
            clearTimeout(timeoutId);
            if (resp.ok) {
              const json = await resp.json();
              dataJsonBlob = json;
              dataJsonBlobTs = Date.now();
              saveDataJsonToLocalStorage(json);
              dataJsonInFlight = null;
              return json;
            }
          } catch(e) { /* essaie l'URL suivante */ }
        }
        dataJsonInFlight = null;
        // Dernier recours : ancienne copie locale (mieux qu'un échec total)
        const stale = loadDataJsonFromLocalStorage();
        if (stale) return stale;
        throw new Error('data.json indisponible (CDN + brut + local vides)');
      })();
      return dataJsonInFlight;
    }

    // Au démarrage : pré-charge le cache mémoire depuis localStorage tout de suite,
    // pour que le tout premier rendu ait déjà des données (0ms d'attente réseau).
    (function bootstrapInstantData() {
      const stale = loadDataJsonFromLocalStorage();
      if (stale) { dataJsonBlob = stale; dataJsonBlobTs = 0; /* ts=0 force un refresh réseau derrière */ }
    })();

    // ---- REQUÊTES ----
    // ============================================================
    //  fetchPriority MODIFIÉE : lit d'abord depuis data.json
    // ============================================================
    async function fetchPriority(symbol, interval, apiKey, outputsize, cacheSec, signal, retries = 0) {
      if (!signal || typeof signal.aborted !== 'boolean') throw new Error('Signal invalide');
      const key = symbol + '_' + interval;
      const cached = getCache(key);
      if (cached) {
        setRequestStatus(key, 'done', '✅ Cache');
        return cached;
      }

      // ============================================================
      //  0. Indices synthétiques Deriv (WebSocket, données réelles)
      // ============================================================
      if (SYNTHETIC_SYMBOLS.has(symbol)) {
        setRequestStatus(key, 'running', '⟳ Deriv WS...');
        try {
          const candles = await fetchDerivCandles(symbol, interval, outputsize, cacheSec);
          setRequestStatus(key, 'done', '✅ Deriv Live');
          return candles;
        } catch(e) {
          setRequestStatus(key, 'error', '⚠️ Deriv: ' + e.message);
          throw e;
        }
      }

      // ============================================================
      //  0bis. Flux serveur sans clé (données réelles)
      // ============================================================
      setRequestStatus(key, 'running', '⟳ Flux serveur...');
      {
        const srv = await fetchServerCandles(symbol, interval, outputsize);
        if (srv) {
          setCache(key, srv, cacheSec);
          setRequestStatus(key, 'done', '✅ Live serveur');
          return srv;
        }
      }

      // ============================================================
      //  1. Lire depuis data.json (blob partagé, 1 seul téléchargement)
      // ============================================================
      try {
        const allData = await getDataJsonBlob(signal);

        let candles = null;
        if (allData.pairs && Array.isArray(allData.pairs)) {
          for (const p of allData.pairs) {
            if (p.id === symbol || p.symbol === symbol) {
              if (p.candles && p.candles[interval]) {
                candles = p.candles[interval];
                break;
              }
            }
          }
        }

        if (candles && candles.length > 0) {
          if (typeof candles[0] === 'object' && candles[0].close !== undefined) {
            setCache(key, candles, cacheSec);
            setRequestStatus(key, 'done', '✅ data.json');
            return candles;
          }
        }
      } catch(e) {
        // Silencieux
      }
      
      // ============================================================
      //  2. Fallback : API Twelve Data
      // ============================================================
      console.log('📡 Fallback API Twelve pour', symbol, interval);
      return fetchPriorityAPI(symbol, interval, apiKey, outputsize, cacheSec, signal, retries);
    }

    async function fetchPriorityAPI(symbol, interval, apiKey, outputsize, cacheSec, signal, retries = 0) {
      if (!signal || typeof signal.aborted !== 'boolean') throw new Error('Signal invalide');
      const key = symbol + '_' + interval;
      if (!apiKey || apiKey === 'SERVER') {
        setRequestStatus(key, 'error', '⚠️ Pas de données pour ce marché');
        throw new Error('Aucune donnée disponible pour ' + symbol + ' en ' + interval);
      }
      while (PRIORITY_IN_FLIGHT >= MAX_PRIORITY_CONCURRENT) {
        await new Promise(r => setTimeout(r, 100));
        if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
      }
      PRIORITY_IN_FLIGHT++;
      const seq = REQUEST_SEQUENCE++;
      setRequestStatus(key, 'running', '⟳ Chargement...', seq);
      try {
        const url = API + '/time_series?symbol=' + encodeURIComponent(symbol) + '&interval=' + interval + '&outputsize=' + outputsize + '&apikey=' + apiKey;
        await waitForApiSlot(signal);
        const res = await fetch(url, { signal });
        if (res.status === 429) {
          PRIORITY_IN_FLIGHT--;
          const wait = Math.min(RATE_LIMIT_WAIT, 1000 * Math.pow(2, Math.min(retries, 6)));
          setRequestStatus(key, 'pending', `⏳ Rate-limit, attente ${Math.round(wait/1000)}s`, seq);
          await new Promise(r => setTimeout(r, wait));
          if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
          return fetchPriorityAPI(symbol, interval, apiKey, outputsize, cacheSec, signal, retries + 1);
        }
        const data = await res.json();
        if (data.status === "error" || !data.values) throw new Error(data.message || "Erreur API");
        const candles = data.values.map(v => ({
          time: v.datetime,
          open: parseFloat(v.open),
          high: parseFloat(v.high),
          low: parseFloat(v.low),
          close: parseFloat(v.close),
          volume: parseFloat(v.volume) || 0
        })).reverse();
        setCache(key, candles, cacheSec);
        setRequestStatus(key, 'done', '✅ Terminé', seq);
        PRIORITY_IN_FLIGHT--;
        return candles;
      } catch(e) {
        if (e.name === 'AbortError') setRequestStatus(key, 'done', '⏹️ Annulée', seq);
        else setRequestStatus(key, 'error', '⚠️ Erreur: ' + e.message, seq);
        PRIORITY_IN_FLIGHT--;
        throw e;
      }
    }

    async function fetchWithCache(symbol, interval, apiKey, outputsize, cacheSec, signal) {
      if (!signal || typeof signal.aborted !== 'boolean') return Promise.reject(new Error('Signal invalide'));
      const key = symbol + '_' + interval;
      const cached = getCache(key);
      if (cached) return cached;
      if (SYNTHETIC_SYMBOLS.has(symbol)) {
        setRequestStatus(key, 'running', '⟳ Deriv WS...');
        try {
          const candles = await fetchDerivCandles(symbol, interval, outputsize, cacheSec);
          setRequestStatus(key, 'done', '✅ Deriv Live');
          return candles;
        } catch(e) {
          setRequestStatus(key, 'error', '⚠️ Deriv: ' + e.message);
          throw e;
        }
      }
      // ---- Flux serveur sans clé d'abord (données réelles, pas de quota) ----
      {
        const srv = await fetchServerCandles(symbol, interval, outputsize);
        if (srv) {
          setCache(key, srv, cacheSec);
          setRequestStatus(key, 'done', '✅ Live serveur');
          return srv;
        }
      }
      // ---- data.json d'abord (gratuit, pas de quota) — corrige le trou où
      //      scanMarket/loadTopPick tapaient direct l'API payante en boucle ----
      try {
        const allData = await getDataJsonBlob(signal);
        let candles = null;
        if (allData.pairs && Array.isArray(allData.pairs)) {
          for (const p of allData.pairs) {
            if (p.id === symbol || p.symbol === symbol) {
              if (p.candles && p.candles[interval]) { candles = p.candles[interval]; break; }
            }
          }
        }
        if (candles && candles.length > 0 && typeof candles[0] === 'object' && candles[0].close !== undefined) {
          setCache(key, candles, cacheSec);
          setRequestStatus(key, 'done', '✅ data.json');
          return candles;
        }
      } catch(e) { /* silencieux, fallback API live ci-dessous */ }
      if (IN_FLIGHT.has(key)) {
        setRequestStatus(key, 'pending', '⏳ En attente');
        return new Promise((resolve, reject) => {
          const check = () => {
            if (signal.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
            if (!IN_FLIGHT.has(key)) { const c = getCache(key); if (c) resolve(c); else reject(new Error('Cache absent')); }
            else setTimeout(check, 100);
          };
          check();
        });
      }
      if (!apiKey || apiKey === 'SERVER') {
        setRequestStatus(key, 'error', '⚠️ Pas de données pour ce marché');
        throw new Error('Aucune donnée disponible pour ' + symbol + ' en ' + interval);
      }
      IN_FLIGHT.add(key);
      const seq = REQUEST_SEQUENCE++;
      setRequestStatus(key, 'running', '⟳ File d\'attente...', seq);
      try {
        const data = await enqueueRequest(async () => {
          const url = API + '/time_series?symbol=' + encodeURIComponent(symbol) + '&interval=' + interval + '&outputsize=' + outputsize + '&apikey=' + apiKey;
          let attempt = 0;
          while (true) {
            await waitForApiSlot(signal);
            const res = await fetch(url, { signal });
            if (res.status === 429) {
              attempt++;
              if (attempt > 8) throw new Error('Rate-limit persistant, abandon');
              const wait = Math.min(RATE_LIMIT_WAIT, 1000 * Math.pow(2, Math.min(attempt, 6)));
              setRequestStatus(key, 'pending', `⏳ Rate-limit, attente ${Math.round(wait/1000)}s`, seq);
              await new Promise(r => setTimeout(r, wait));
              if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
              continue;
            }
            const data = await res.json();
            if (data.status === "error" || !data.values) throw new Error(data.message || "Erreur API");
            const candles = data.values.map(v => ({
              time: v.datetime,
              open: parseFloat(v.open),
              high: parseFloat(v.high),
              low: parseFloat(v.low),
              close: parseFloat(v.close),
              volume: parseFloat(v.volume) || 0
            })).reverse();
            setCache(key, candles, cacheSec);
            setRequestStatus(key, 'done', '✅ Terminé', seq);
            return candles;
          }
        });
        IN_FLIGHT.delete(key);
        return data;
      } catch(e) {
        if (e.name === 'AbortError') setRequestStatus(key, 'done', '⏹️ Annulée', seq);
        else setRequestStatus(key, 'error', '⚠️ Erreur: ' + e.message, seq);
        IN_FLIGHT.delete(key);
        throw e;
      }
    }

    // ---- NEWS ----
    async function fetchNews(apiKey) {
      if (!apiKey || apiKey === 'SERVER') return [];
      try {
        const url = `https://finnhub.io/api/v1/calendar/economic?token=${apiKey}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data.economicCalendar) {
            const now = Date.now();
            return data.economicCalendar
              .filter(e => e.impact && (e.impact === 'high' || e.impact === 'medium'))
              .filter(e => new Date(e.releaseDate).getTime() > now - 3600000)
              .sort((a,b) => new Date(a.releaseDate) - new Date(b.releaseDate))
              .slice(0, 5)
              .map(e => ({ time: new Date(e.releaseDate), title: e.event, impact: e.impact.toLowerCase(), currency: e.currency || 'USD' }));
          }
        }
      } catch(e) {}
      return [];
    }

    // ---- JOURNAL ----
    function getTradeJournal() {
      try { const d = localStorage.getItem('blackzeldon_journal_v10'); return d ? JSON.parse(d) : []; }
      catch(e) { return []; }
    }
    function saveTradeJournal(j) {
      try { localStorage.setItem('blackzeldon_journal_v10', JSON.stringify(j)); }
      catch(e) {
        // Auto-réparation : si le quota est dépassé, on réduit l'historique de
        // moitié et on réessaie une fois, au lieu d'échouer silencieusement.
        if (e.name === 'QuotaExceededError' && j.length > 20) {

    function addTradeToJournal(trade) {

    function updateTradeResult(id, result, exitPrice, rMultiple) {
      const j = getTradeJournal();

    function calculateStats(journal) {
      const closed = journal.filter(t => t.result !== 'pending' && t.result !== undefined);
      const total = closed.length;
      if (total === 0) return null;
      const wins = closed.filter(t => t.result === 'win').length;
      const losses = closed.filter(t => t.result === 'loss').length;
      const winrate = total > 0 ? wins / total : 0;
      let totalGain = 0, totalLoss = 0, gains = [], lossesArr = [];
      closed.forEach(t => {
        const r = t.rMultiple || (t.result === 'win' ? 2 : -1);
        if (t.result === 'win') { totalGain += r; gains.push(r); }
        else { totalLoss += 1; lossesArr.push(1); }
      });
      const profitFactor = totalLoss > 0 ? totalGain / totalLoss : 0;
      const avgGain = gains.length > 0 ? gains.reduce((a,b) => a+b, 0) / gains.length : 0;
      const avgLoss = lossesArr.length > 0 ? lossesArr.reduce((a,b) => a+b, 0) / lossesArr.length : 0;
      let equity = 0, peak = 0, maxDrawdown = 0, maxDrawdownR = 0, equityCurve = [];
      let currentStreak = 0, streakType = null, maxWinStreak = 0, maxLossStreak = 0;
      closed.forEach(t => {
        const r = t.rMultiple || (t.result === 'win' ? 2 : -1);
        if (t.result === 'win') { equity += r; if (streakType === 'win') currentStreak++; else { currentStreak = 1; streakType = 'win'; } maxWinStreak = Math.max(maxWinStreak, currentStreak); }
        else { equity -= 1; if (streakType === 'loss') currentStreak++; else { currentStreak = 1; streakType = 'loss'; } maxLossStreak = Math.max(maxLossStreak, currentStreak); }
        if (equity > peak) peak = equity;
        const ddR = peak - equity; if (ddR > maxDrawdownR) maxDrawdownR = ddR;
        const dd = peak > 0 ? (peak - equity) / peak * 100 : 0; if (dd > maxDrawdown) maxDrawdown = dd;
        equityCurve.push({ index: equityCurve.length, equity, dd });
      });
      const byPair = {}, byTF = {}, bySession = {}, byDay = {}, bySetup = {};
      closed.forEach(t => {
        const pair = t.pair;
        if (!byPair[pair]) byPair[pair] = { wins: 0, losses: 0, total: 0 };
        byPair[pair].total++; if (t.result === 'win') byPair[pair].wins++; else byPair[pair].losses++;
        const tf = t.timeframe;
        if (!byTF[tf]) byTF[tf] = { wins: 0, losses: 0, total: 0 };
        byTF[tf].total++; if (t.result === 'win') byTF[tf].wins++; else byTF[tf].losses++;
        // Ces 3 breakdowns nécessitent les champs session/dayOfWeek/setupType,
        // ajoutés à l'ouverture des trades — absents sur les trades enregistrés
        // avant cette mise à jour (honnête : pas de reconstitution rétroactive).
        if (t.session) {
          if (!bySession[t.session]) bySession[t.session] = { wins: 0, losses: 0, total: 0 };
          bySession[t.session].total++; if (t.result === 'win') bySession[t.session].wins++; else bySession[t.session].losses++;
        }
        if (t.dayOfWeek) {
          if (!byDay[t.dayOfWeek]) byDay[t.dayOfWeek] = { wins: 0, losses: 0, total: 0 };
          byDay[t.dayOfWeek].total++; if (t.result === 'win') byDay[t.dayOfWeek].wins++; else byDay[t.dayOfWeek].losses++;
        }
        if (t.setupType) {
          if (!bySetup[t.setupType]) bySetup[t.setupType] = { wins: 0, losses: 0, total: 0 };
          bySetup[t.setupType].total++; if (t.result === 'win') bySetup[t.setupType].wins++; else bySetup[t.setupType].losses++;
        }
      });
      const signalReliability = {};
      closed.forEach(t => {
        if (t.scores) {
          Object.keys(t.scores).forEach(key => {
            if (!signalReliability[key]) signalReliability[key] = { total: 0, wins: 0 };
            signalReliability[key].total++;
            if (t.result === 'win') signalReliability[key].wins++;
          });
        }
      });
      // Expectancy réelle (espérance en R par trade) et R moyen global —
      // calculés sur les vrais rMultiple enregistrés, pas une approximation.
      const rValues = closed.map(t => t.result === 'win' ? (t.rMultiple || 2) : -(t.rMultiple ? Math.abs(t.rMultiple) : 1));
      const avgR = rValues.length > 0 ? rValues.reduce((a,b) => a+b, 0) / rValues.length : 0;
      const expectancy = winrate * avgGain - (1 - winrate) * avgLoss;
      return { total, wins, losses, winrate, profitFactor, avgGain, avgLoss, avgR, expectancy, maxDrawdown, maxDrawdownR, maxWinStreak, maxLossStreak, equityCurve, byPair, byTF, bySession, byDay, bySetup, signalReliability };
    }

    // ---- Historique serveur durable (backtest longue période) ----
    const BZ_JOURNAL_URL = '/api/public/bz/journal';
    function bzClientId() {
      try {
        let id = localStorage.getItem('blackzeldon_client_id');

    function bzEntryKey(s) { return String(s.pair) + '|' + String(s.timeframe) + '|' + String(s.timestamp || s.id); }
    function bzNum(v) { const n = Number(v); return (v === null || v === undefined || !isFinite(n)) ? null : n; }
    const bzSynced = {};
    let bzSyncTimer = null;
    function scheduleJournalSync(j) {
      clearTimeout(bzSyncTimer);
      bzSyncTimer = setTimeout(() => {
        const dirty = [];
        (j || []).forEach(s => {
          if (!s || !s.pair || !s.timeframe || !s.timestamp) return;
          const key = bzEntryKey(s);
          const sig = (s.result || '') + '|' + (s.rMultiple ?? '') + '|' + (s.closedAt || '');
          if (bzSynced[key] === sig) return;
          dirty.push({ key, sig, row: {
            key, pair: String(s.pair), timeframe: String(s.timeframe),
            direction: s.direction || s.dir || null,
            score: bzNum(s.score), probability: bzNum(s.prob ?? s.probability),
            entry: bzNum(s.entryPrice), sl: bzNum(s.slPrice), tp1: bzNum(s.tp1Price), tp2: bzNum(s.tp2Price), tp3: bzNum(s.tp3Price),
