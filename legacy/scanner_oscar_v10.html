    // ---- BACKTEST RÉALISTE ----
    function runRealisticBacktest(apiKey, pairs, tfList, customWeights) {
      return new Promise(async (resolve) => {
        const results = [];
        let totalTrades = 0, wins = 0, losses = 0;
        let totalGain = 0, totalLoss = 0;
        const equityCurve = [];
        let equity = 0, peak = 0, maxDD = 0;
        let currentStreak = 0, streakType = null, maxWinStreak = 0, maxLossStreak = 0;
        const gains = [], lossesArr = [];
        const byPair = {}, byTF = {};
        const tradeResults = [];

        const COMMISSION_PER_LOT = 0.5;
        const SLIPPAGE_PIPS = 0.5;

        for (const p of pairs) {
          let spreadPips = 0.5;
          if (p.id === 'EURUSD') spreadPips = 0.3;
          else if (p.id === 'GBPUSD') spreadPips = 0.5;
          else if (p.id === 'AUDUSD') spreadPips = 0.4;
          else if (p.id === 'XAUUSD') spreadPips = 2;
          else if (p.id === 'US30') spreadPips = 1;
          else if (p.id === 'BTCUSD') spreadPips = 10;
          else if (p.id === 'ETHUSD') spreadPips = 5;
          else spreadPips = 1;

          for (const tf of tfList) {
            if (tf.id === '1week') continue;
            try {
              const key = p.symbol + '_' + tf.apiInterval + '_bt';
              let candles = getCache(key);
              if (!candles) {
                const url = API + '/time_series?symbol=' + encodeURIComponent(p.symbol) + '&interval=' + tf.apiInterval + '&outputsize=350&apikey=' + apiKey;
                await waitForApiSlot();
                const res = await fetch(url);
                if (res.status === 429) { await new Promise(r => setTimeout(r, 15000)); continue; }
                const data = await res.json();
                if (data.status === "error" || !data.values) continue;
                candles = data.values.map(v => ({
                  time: v.datetime,
                  open: parseFloat(v.open),
                  high: parseFloat(v.high),
                  low: parseFloat(v.low),
                  close: parseFloat(v.close),
                  volume: parseFloat(v.volume) || 0
                })).reverse();
                setCache(key, candles, 3600);
              }
              if (!candles || candles.length < 60) continue;

              let i = 50;
              while (i < candles.length - 20) {
                const slice = candles.slice(0, i);
                if (slice.length < 40) { i++; continue; }
                const kzNow = activeKZForPair(lomeMin(new Date(slice[slice.length-1].time)), p, new Date(slice[slice.length-1].time));
                const higherData = {};
                try {
                  const d1Key = p.symbol + '_1day_bt';
                  const d1 = getCache(d1Key);
                  if (d1 && d1.length > 20) {
                    const d1Closes = d1.map(c => c.close);
                    const ema200 = calcEMA(d1Closes, 200);
                    higherData.daily = { bias: d1Closes[d1Closes.length-1] > ema200[ema200.length-1] ? 'Haussier' : 'Baissier', lastClose: d1Closes[d1Closes.length-1], ema200: ema200[ema200.length-1] };
                  }
                } catch(e) {}

                const result = fullAnalysis(p, slice, tf, kzNow, customWeights, [], higherData, false);
                if (result && result.dir !== "PAS DE TRADE" && result.plan) {
                  const entry = result.plan.entryA;
                  const sl = result.plan.sl;
                  const tp1 = result.plan.tp1;
                  const tp2 = result.plan.tp2;
                  const tp3 = result.plan.tp3;
                  const slippage = (Math.random() - 0.5) * SLIPPAGE_PIPS * p.pip;
                  const entryWithSlippage = entry + slippage;
                  const lotSize = 1;
                  const commission = COMMISSION_PER_LOT * lotSize;

                  let closed = false, exitPrice = 0, tradeResult = 'loss', rMultiple = 0;
                  let netProfit = 0;
                  for (let j = i + 1; j < candles.length; j++) {
                    const c = candles[j];
                    const adjustedSL = result.dir === 'BUY' ? sl - spreadPips * p.pip : sl + spreadPips * p.pip;
                    const adjustedTP1 = result.dir === 'BUY' ? tp1 + spreadPips * p.pip : tp1 - spreadPips * p.pip;
                    const adjustedTP2 = result.dir === 'BUY' ? tp2 + spreadPips * p.pip : tp2 - spreadPips * p.pip;
                    const adjustedTP3 = result.dir === 'BUY' ? tp3 + spreadPips * p.pip : tp3 - spreadPips * p.pip;

                    if (result.dir === 'BUY') {
                      if (c.low <= adjustedSL) { exitPrice = adjustedSL; tradeResult = 'loss'; rMultiple = -1; closed = true; i = j; break; }
                      else if (c.high >= adjustedTP1 && c.high < adjustedTP2) { exitPrice = adjustedTP1; tradeResult = 'win'; rMultiple = 1; closed = true; i = j; break; }
                      else if (c.high >= adjustedTP2 && c.high < adjustedTP3) { exitPrice = adjustedTP2; tradeResult = 'win'; rMultiple = 2; closed = true; i = j; break; }
                      else if (c.high >= adjustedTP3) { exitPrice = adjustedTP3; tradeResult = 'win'; rMultiple = 3; closed = true; i = j; break; }
                    } else {
                      if (c.high >= adjustedSL) { exitPrice = adjustedSL; tradeResult = 'loss'; rMultiple = -1; closed = true; i = j; break; }
                      else if (c.low <= adjustedTP1 && c.low > adjustedTP2) { exitPrice = adjustedTP1; tradeResult = 'win'; rMultiple = 1; closed = true; i = j; break; }
                      else if (c.low <= adjustedTP2 && c.low > adjustedTP3) { exitPrice = adjustedTP2; tradeResult = 'win'; rMultiple = 2; closed = true; i = j; break; }
                      else if (c.low <= adjustedTP3) { exitPrice = adjustedTP3; tradeResult = 'win'; rMultiple = 3; closed = true; i = j; break; }
                    }
                  }
                  if (closed) {
                    const pipValue = p.pip || 0.0001;
                    const points = (exitPrice - entryWithSlippage) / pipValue;
                    const grossProfit = points * lotSize * (p.type === 'fx' ? 10 : 1);
                    netProfit = grossProfit - commission;
                    const riskAmount = Math.abs(entryWithSlippage - adjustedSL) / pipValue * lotSize * (p.type === 'fx' ? 10 : 1);
                    const rEffective = riskAmount > 0 ? netProfit / riskAmount : 0;

                    totalTrades++;
                    if (netProfit > 0) {
                      wins++;
                      totalGain += netProfit;
                      gains.push(netProfit);
                      if (streakType === 'win') currentStreak++; else { currentStreak = 1; streakType = 'win'; }
                      maxWinStreak = Math.max(maxWinStreak, currentStreak);
                    } else {
                      losses++;
                      totalLoss += Math.abs(netProfit);
                      lossesArr.push(Math.abs(netProfit));
                      if (streakType === 'loss') currentStreak++; else { currentStreak = 1; streakType = 'loss'; }
                      maxLossStreak = Math.max(maxLossStreak, currentStreak);
                    }
                    equity += netProfit;
                    if (equity > peak) peak = equity;
                    const dd = peak > 0 ? (peak - equity) / peak * 100 : 0;
                    if (dd > maxDD) maxDD = dd;
                    equityCurve.push({ index: equityCurve.length, equity, dd });

                    if (!byPair[p.label]) byPair[p.label] = { wins:0, losses:0, total:0 };
                    byPair[p.label].total++;
                    if (netProfit > 0) byPair[p.label].wins++; else byPair[p.label].losses++;

                    if (!byTF[tf.label]) byTF[tf.label] = { wins:0, losses:0, total:0 };
                    byTF[tf.label].total++;
                    if (netProfit > 0) byTF[tf.label].wins++; else byTF[tf.label].losses++;

                    tradeResults.push({ pair: p.label, tf: tf.label, dir: result.dir, entry: entryWithSlippage, exit: exitPrice, result: netProfit > 0 ? 'win' : 'loss', rMultiple: rEffective, score: result.scoreTotal, netProfit });
                  }
                }
                i++;
              }
            } catch(e) { console.warn('Backtest error:', e); }
          }
        }

        const winrate = totalTrades > 0 ? wins / totalTrades : 0;
        const profitFactor = totalLoss > 0 ? totalGain / totalLoss : 0;
        const avgGain = gains.length > 0 ? gains.reduce((a,b) => a+b, 0) / gains.length : 0;
        const avgLoss = lossesArr.length > 0 ? lossesArr.reduce((a,b) => a+b, 0) / lossesArr.length : 0;
        const avgR = tradeResults.length > 0 ? tradeResults.reduce((s,t) => s + t.rMultiple, 0) / tradeResults.length : 0;
        const expectancy = winrate * avgGain - (1 - winrate) * avgLoss;

        resolve({
          totalTrades, wins, losses, winrate, profitFactor,
          avgGain, avgLoss, avgR, expectancy, maxDD, maxWinStreak, maxLossStreak,
          equityCurve, byPair, byTF, results: tradeResults
        });
      });
    }


    // ==========================================================
    //  MOTEUR DE RECOUPEMENT "QUANTUM EDGE" (v11 — ajout)
    //  Calculs statistiques avancés, indépendants du scoring
    //  existant : rien n'est modifié, tout est ajouté par-dessus.
    // ==========================================================
    function qxReturns(candles) {
      const r = [];
      for (let i = 1; i < candles.length; i++) {
        const a = candles[i-1].close, b = candles[i].close;
        if (a > 0 && b > 0) r.push(Math.log(b / a));
      }
      return r;
    }
    function qxStd(a) { if (a.length < 2) return 0; const m = a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((x,y)=>x+Math.pow(y-m,2),0)/(a.length-1)); }
    function qxMean(a) { return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }

    // --- Exposant de Hurst (R/S) : >0.5 persistance (trend), <0.5 mean-reversion
    function qxHurst(returns) {
      const n = returns.length;
      if (n < 32) return { h: 0.5, regime: "Indéterminé" };
      const sizes = [8, 16, 32, 64, 128].filter(s => s <= n);
      const xs = [], ys = [];
      sizes.forEach(size => {
        const blocks = Math.floor(n / size);
        let acc = 0, cnt = 0;
        for (let b = 0; b < blocks; b++) {
          const seg = returns.slice(b*size, (b+1)*size);
          const m = qxMean(seg);
          let cum = 0, mn = Infinity, mx = -Infinity;
          seg.forEach(v => { cum += v - m; if (cum < mn) mn = cum; if (cum > mx) mx = cum; });
          const sd = qxStd(seg);
          if (sd > 0) { acc += (mx - mn) / sd; cnt++; }
        }
        if (cnt) { xs.push(Math.log(size)); ys.push(Math.log(acc / cnt)); }
      });
      if (xs.length < 2) return { h: 0.5, regime: "Indéterminé" };
      const mx = qxMean(xs), my = qxMean(ys);
      let num = 0, den = 0;
      xs.forEach((x,i) => { num += (x-mx)*(ys[i]-my); den += Math.pow(x-mx,2); });
      const h = den ? num/den : 0.5;
      return { h: Math.max(0, Math.min(1, h)), regime: h > 0.57 ? "Persistant (tendance)" : h < 0.43 ? "Anti-persistant (range)" : "Brownien (neutre)" };
    }

    // --- Entropie de Shannon normalisée : bas = marché ordonné/prévisible
    function qxEntropy(returns, bins = 12) {
      if (returns.length < 20) return 1;
      const mn = Math.min.apply(null, returns), mx = Math.max.apply(null, returns);
      if (mx === mn) return 0;
      const hist = new Array(bins).fill(0);
      returns.forEach(v => { const i = Math.min(bins-1, Math.floor((v-mn)/(mx-mn)*bins)); hist[i]++; });
      let H = 0;
      hist.forEach(c => { if (c) { const p = c / returns.length; H -= p * Math.log(p); } });
      return H / Math.log(bins);
    }

    // --- Autocorrélation lag-1 (momentum microstructurel)
    function qxAutocorr(returns, lag = 1) {
      const n = returns.length; if (n < lag + 8) return 0;
      const m = qxMean(returns);
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) { den += Math.pow(returns[i]-m,2); if (i >= lag) num += (returns[i]-m)*(returns[i-lag]-m); }
      return den ? num/den : 0;
    }

    // --- Dimension fractale de Katz (rugosité du prix)
    function qxFractalDim(closes) {
      const n = closes.length; if (n < 12) return 1.5;
      let L = 0, d = 0;
      for (let i = 1; i < n; i++) { L += Math.abs(closes[i]-closes[i-1]); d = Math.max(d, Math.abs(closes[i]-closes[0])); }
      if (!L || !d) return 1.5;
      const a = L/(n-1);
      return Math.log10(L/a) / (Math.log10(d/a) + Math.log10(L/a) || 1);
    }

    // --- Compression de volatilité (squeeze) : ATR court / ATR long
    function qxSqueeze(candles) {
      if (candles.length < 60) return { ratio: 1, state: "N/A" };
      const shortA = calcATR(candles.slice(-15), 10), longA = calcATR(candles.slice(-60), 30);
      const ratio = longA > 0 ? shortA/longA : 1;
      return { ratio, state: ratio < 0.62 ? "Compression extrême" : ratio < 0.85 ? "Compression" : ratio > 1.35 ? "Expansion" : "Normale" };
    }

    // --- VaR / CVaR historiques 95% sur le TF courant
    function qxTailRisk(returns) {
      if (returns.length < 25) return { var95: 0, cvar95: 0 };
      const s = returns.slice().sort((a,b) => a-b);
      const idx = Math.max(0, Math.floor(s.length*0.05) - 1);
      const var95 = s[idx];
      const tail = s.slice(0, idx+1);
      return { var95: Math.abs(var95), cvar95: Math.abs(qxMean(tail)) };
    }

    // --- Kelly fractionnaire (demi-Kelly, plafonné)
    function qxKelly(prob, rr) {
      const p = Math.max(0, Math.min(1, prob)), b = rr || 2;
      const k = (p*(b+1) - 1) / b;
      return Math.max(0, Math.min(0.25, k*0.5));
    }

    // --- Z-Score de la dernière bougie vs distribution récente
    function qxZScore(returns) {
      if (returns.length < 20) return 0;
      const hist = returns.slice(0, -1), last = returns[returns.length-1];
      const sd = qxStd(hist); if (!sd) return 0;
      return (last - qxMean(hist)) / sd;
    }

    // --- Absorption : gros range, faible progression = ordres absorbés
    function qxAbsorption(candles) {
      const c = candles.slice(-8); if (c.length < 5) return { ratio: 0, note: "—" };
      let range = 0; c.forEach(x => range += (x.high - x.low));
      const net = Math.abs(c[c.length-1].close - c[0].open);
      const ratio = range > 0 ? net/range : 0;
      return { ratio, note: ratio < 0.18 ? "Absorption forte (accumulation)" : ratio > 0.55 ? "Expansion directionnelle" : "Flux équilibré" };
    }


    // ==========================================================
    //  MODULES PRÉDICTIFS AVANCÉS (ajout non destructif)
    //  GARCH · Markov · Monte-Carlo · Kalman · Hawkes · OB retest
    // ==========================================================

    // --- GARCH(1,1) simplifié : prévision de volatilité de la prochaine bougie.
    // Paramètres classiques marchés intraday (alpha .09 / beta .88) ; omega est
    // calibré sur la variance long terme observée pour rester sans biais.
    function qxGarch(rets) {
      if (!rets || rets.length < 40) return { sigma: 0, ratio: 1, state: "N/A" };
      const a = 0.09, b = 0.88;
      const lt = rets.reduce((k, r) => k + r * r, 0) / rets.length;
      const omega = Math.max(1e-12, lt * (1 - a - b));
      let v = lt;
      for (let i = 0; i < rets.length; i++) v = omega + a * rets[i] * rets[i] + b * v;
      const sigma = Math.sqrt(Math.max(v, 1e-12));
      const ratio = Math.sqrt(lt) > 0 ? sigma / Math.sqrt(lt) : 1;
      return { sigma, ratio,
        state: ratio > 1.35 ? "Vol. en expansion" : ratio < 0.75 ? "Vol. comprimée" : "Vol. stable" };
    }

    // --- Chaîne de Markov d'ordre 1 sur le signe des rendements :
    // probabilité que la prochaine bougie prolonge la dernière.
    function qxMarkov(rets) {
      if (!rets || rets.length < 30) return { persist: 0.5, note: "N/A", last: 0 };
      let uu = 0, ud = 0, du = 0, dd = 0;
      for (let i = 1; i < rets.length; i++) {
        const prev = rets[i-1] >= 0, cur = rets[i] >= 0;
        if (prev && cur) uu++; else if (prev && !cur) ud++;
        else if (!prev && cur) du++; else dd++;
      }
      const last = rets[rets.length-1] >= 0 ? 1 : -1;
      const pUp = (uu + 1) / (uu + ud + 2);      // lissage de Laplace
      const pDn = (dd + 1) / (dd + du + 2);
      const persist = last > 0 ? pUp : pDn;
      return { persist, last, pUp, pDn,
        note: (persist > 0.58 ? "Continuation probable" : persist < 0.44 ? "Retournement probable" : "Neutre") };
    }

    // --- Monte-Carlo par bootstrap des rendements réels (pas de loi normale
    // fantaisiste) : on rejoue N trajectoires bougie par bougie et on compte
    // combien atteignent le TP avant le SL. C'est la vraie limite prédictive
    // exploitable : P(TP1 avant SL), P(TP2), R espéré.
    function qxMonteCarlo(candles, plan, dir, rets, paths, horizon) {
      if (!plan || !rets || rets.length < 30 || (dir !== "BUY" && dir !== "SELL"))
        return null;
      const N = paths || 500, Hn = horizon || 60;
      const price0 = candles[candles.length-1].close;
      const isBuy = dir === "BUY";
      const sl = plan.sl, tp1 = plan.tp1, tp2 = plan.tp2, tp3 = plan.tp3;
      if (![sl, tp1, tp2].every(Number.isFinite)) return null;
      const risk = Math.abs(plan.entryA - sl) || 1e-9;
      let hit1 = 0, hit2 = 0, hit3 = 0, stops = 0, sumR = 0, timeouts = 0;
      const L = rets.length;
      for (let n = 0; n < N; n++) {
        let px = price0, done = false;
        for (let t = 0; t < Hn; t++) {
          px = px * (1 + rets[(Math.random() * L) | 0]);
          const up = isBuy;
          if ((up && px <= sl) || (!up && px >= sl)) { stops++; sumR -= 1; done = true; break; }
          if ((up && px >= tp3) || (!up && px <= tp3)) { hit1++; hit2++; hit3++; sumR += 3; done = true; break; }
          if ((up && px >= tp2) || (!up && px <= tp2)) { hit1++; hit2++; sumR += 2; done = true; break; }
          if ((up && px >= tp1) || (!up && px <= tp1)) { hit1++; sumR += 1; done = true; break; }
        }
        if (!done) { timeouts++; sumR += (isBuy ? (px - plan.entryA) : (plan.entryA - px)) / risk; }
      }
      return {
        pTP1: hit1 / N, pTP2: hit2 / N, pTP3: hit3 / N,
        pSL: stops / N, pTimeout: timeouts / N,
        expR: sumR / N, paths: N, horizon: Hn
      };
    }

    // --- Filtre de Kalman (position/vitesse) : pente de tendance débruitée
    // et niveau de confiance associé — beaucoup plus stable qu'une EMA.
    function qxKalman(closes) {
      if (!closes || closes.length < 25) return { slope: 0, conf: 0, dir: "Neutre" };
      let x = closes[0], v = 0, P = [[1,0],[0,1]];
      const q = 1e-5, r = 1e-2;
      for (let i = 1; i < closes.length; i++) {
        x = x + v;
        P = [[P[0][0]+P[0][1]+P[1][0]+P[1][1]+q, P[0][1]+P[1][1]], [P[1][0]+P[1][1], P[1][1]+q]];
        const S = P[0][0] + r, K0 = P[0][0]/S, K1 = P[1][0]/S;
        const y = closes[i] - x;
        x += K0*y; v += K1*y;
        P = [[P[0][0]*(1-K0), P[0][1]*(1-K0)], [P[1][0]-K1*P[0][0], P[1][1]-K1*P[0][1]]];
      }
      const ref = closes[closes.length-1] || 1;
      const slope = ref ? v / ref : 0;
      const rr = [];
      for (let i = 1; i < closes.length; i++) if (closes[i-1]) rr.push(closes[i]/closes[i-1] - 1);
      const sd = qxStd(rr) || 1e-9;
      const conf = Math.max(0, Math.min(1, Math.abs(slope) / (sd * 1.5)));
      return { slope, conf, dir: slope > 0 ? "Haussier" : slope < 0 ? "Baissier" : "Neutre" };
    }

    // --- Intensité de type Hawkes : les chocs de volatilité s'auto-excitent.
    // Intensité haute = probabilité élevée d'un nouveau choc imminent.
    function qxHawkes(rets) {
      if (!rets || rets.length < 40) return { lambda: 0, state: "N/A" };
      const sd = qxStd(rets) || 1e-9, decay = 0.86;
      let lam = 0;
      for (let i = 0; i < rets.length; i++) {
        lam *= decay;
        if (Math.abs(rets[i]) > 2 * sd) lam += 1;
      }
      const norm = Math.max(0, Math.min(1, lam / 4));
      return { lambda: norm,
        state: norm > 0.6 ? "Chocs en grappe (danger)" : norm > 0.3 ? "Activité soutenue" : "Marché calme" };
    }

    // --- Détection de retest d'Order Block : c'est exactement le scénario
    // « OB ancien retesté » — on mesure la distance en ATR au bloc valide le
    // plus proche dans le sens du trade, et on anticipe la réaction.
    function qxOBRetest(smc, price, atr, dir) {
      if (!smc || !Number.isFinite(price) || !(atr > 0)) return null;
      const wantBull = dir === "BUY";
      const pool = (wantBull ? (smc.obsBull || []) : (smc.obsBear || [])).concat(
        (smc.fvgs || []).filter(f => f.type === (wantBull ? "bull" : "bear"))
          .map(f => ({ low: Math.min(f.top, f.bottom), high: Math.max(f.top, f.bottom), score: 5, kind: "FVG", mitigated: f.fill > 0.85 }))
      );
      let best = null;
      pool.forEach(o => {
        if (!o || o.mitigated) return;
        const mid = (o.low + o.high) / 2;
        const dist = Math.abs(price - mid) / atr;
        const inside = price >= o.low && price <= o.high;
        const cand = { low: o.low, high: o.high, mid, dist, inside, score: o.score || 5, kind: o.kind || "OB" };
        if (!best || cand.dist < best.dist) best = cand;
      });
      if (!best) return null;
      best.state = best.inside ? "Retest en cours" : best.dist < 0.6 ? "Retest imminent"
        : best.dist < 1.8 ? "Zone approchée" : "Zone éloignée";
      best.readiness = best.inside ? 100 : Math.round(Math.max(0, 100 - best.dist * 42));
      return best;
    }

    // --- Recoupement final : agrège tout en un "Edge Quantique" 0-100
    function computeQuantumEdge(candles, curData, pair) {
      if (!candles || candles.length < 40) return null;
      const closes = candles.map(c => c.close);
      const rets = qxReturns(candles);
      const hurst = qxHurst(rets);
      const entropy = qxEntropy(rets);
      const ac1 = qxAutocorr(rets, 1);
      const fd = qxFractalDim(closes.slice(-80));
      const sq = qxSqueeze(candles);
      const tail = qxTailRisk(rets);
      const z = qxZScore(rets);
      const abs_ = qxAbsorption(candles);
      const dirBull = curData && curData.dir === "BUY";
      const dirBear = curData && curData.dir === "SELL";
      // --- couche prédictive avancée ---
      const garch  = qxGarch(rets);
      const markov = qxMarkov(rets);
      const kal    = qxKalman(closes.slice(-120));
      const hawkes = qxHawkes(rets);
      const mc     = curData ? qxMonteCarlo(candles, curData.plan, curData.dir, rets, 500, 60) : null;
      const obr    = curData ? qxOBRetest(curData.smc, closes[closes.length-1], curData.atrCur, curData.dir) : null;

      const parts = [];
      // 1. Cohérence régime <-> direction
      const trendy = hurst.h > 0.57;
      parts.push({ k: "Hurst", v: trendy ? 100 : hurst.h < 0.43 ? 35 : 60, w: 1.4,
        d: hurst.h.toFixed(3) + " · " + hurst.regime });
      // 2. Ordre du marché (entropie basse = signal exploitable)
      parts.push({ k: "Entropie", v: Math.round((1 - entropy) * 100), w: 1.2, d: entropy.toFixed(3) + " (bas = ordonné)" });
      // 3. Momentum microstructure aligné
      const acAligned = (dirBull && ac1 > 0) || (dirBear && ac1 > 0) ? 100 : ac1 < -0.15 ? 30 : 60;
      parts.push({ k: "Autocorr.", v: acAligned, w: 1.0, d: ac1.toFixed(3) + (ac1 > 0 ? " persistant" : " reversal") });
      // 4. Rugosité : proche de 1.2-1.4 = mouvement propre
      const fdScore = Math.round(Math.max(10, Math.min(100, 100 - Math.abs(fd - 1.05) * 110)));
      parts.push({ k: "Fractale", v: fdScore, w: 0.9, d: fd.toFixed(3) + " (Katz)" });
      // 5. Squeeze : compression avant expansion = timing premium
      parts.push({ k: "Squeeze", v: sq.ratio < 0.62 ? 100 : sq.ratio < 0.85 ? 80 : sq.ratio > 1.35 ? 45 : 65, w: 1.1,
        d: (sq.ratio*100).toFixed(0) + "% · " + sq.state });
      // 6. Risque de queue (CVaR faible = mieux)
      const tailScore = Math.round(Math.max(0, 100 - (tail.cvar95 / (qxStd(rets) || 1e-9)) * 30));
      parts.push({ k: "Tail Risk", v: tailScore, w: 0.8, d: "CVaR95 " + (tail.cvar95*100).toFixed(3) + "%" });
      // 7. Exhaustion : Z extrême contre le sens = danger
      const exhaust = Math.abs(z) > 2.6 ? 35 : Math.abs(z) > 1.8 ? 60 : 90;
      parts.push({ k: "Z-Score", v: exhaust, w: 0.9, d: z.toFixed(2) + "σ " + (Math.abs(z) > 2.6 ? "· exhaustion" : "· normal") });
      // 8. Absorption / flux
      parts.push({ k: "Flux", v: abs_.ratio < 0.18 ? 85 : abs_.ratio > 0.55 ? 92 : 62, w: 1.0, d: abs_.note });

      // 9. Persistance markovienne alignée avec la direction du signal
      const mkAligned = (dirBull && markov.last > 0) || (dirBear && markov.last < 0);
      parts.push({ k: "Markov", v: Math.round((mkAligned ? markov.persist : 1 - markov.persist) * 100), w: 1.1,
        d: (markov.persist*100).toFixed(0) + "% · " + markov.note });
      // 10. Régime de volatilité prévu (GARCH) : expansion = mouvement, mais slippage
      parts.push({ k: "GARCH", v: garch.ratio > 1.35 ? 72 : garch.ratio < 0.75 ? 88 : 66, w: 0.9,
        d: "×" + garch.ratio.toFixed(2) + " · " + garch.state });
      // 11. Pente Kalman débruitée dans le sens du trade
      const kalOk = (dirBull && kal.slope > 0) || (dirBear && kal.slope < 0);
      parts.push({ k: "Kalman", v: Math.round(kalOk ? 55 + kal.conf * 45 : 45 - kal.conf * 30), w: 1.2,
        d: kal.dir + " · conf " + Math.round(kal.conf*100) + "%" });
      // 12. Auto-excitation des chocs (Hawkes) : grappes = risque de stop chasse
      parts.push({ k: "Hawkes", v: Math.round(100 - hawkes.lambda * 55), w: 0.8,
        d: hawkes.state });
      // 13. Retest d'Order Block / FVG : le déclencheur le plus prédictif du SMC
      if (obr) parts.push({ k: "OB Retest", v: obr.readiness, w: 1.5,
        d: obr.kind + " · " + obr.state + " (" + obr.dist.toFixed(2) + " ATR)" });
      // 14. Monte-Carlo : probabilité empirique TP1 avant SL
      if (mc) parts.push({ k: "Monte-Carlo", v: Math.round(Math.max(0, Math.min(100, mc.pTP1 * 100))), w: 1.8,
        d: (mc.pTP1*100).toFixed(0) + "% TP1 avant SL · " + mc.expR.toFixed(2) + "R" });

      let num = 0, den = 0;
      parts.forEach(p => { num += p.v * p.w; den += p.w; });
      const edge = Math.round(num / den);

      const prob = curData ? curData.prob : 0.5;
      // Fusion bayésienne : score historique + edge statistique + Monte-Carlo.
      const blended = mc
        ? Math.max(0, Math.min(0.95, prob * 0.42 + mc.pTP1 * 0.33 + (edge/100) * 0.25))
        : Math.max(0, Math.min(0.95, prob * 0.65 + (edge/100) * 0.35));
      const rrPlan = (curData && curData.plan)
        ? Math.abs(curData.plan.tp2 - curData.plan.entryA) / (Math.abs(curData.plan.entryA - curData.plan.sl) || 1)
        : 2;
      const kelly = qxKelly(blended, rrPlan);
      const verdict = edge >= 78 ? "Confluence quantique élite" : edge >= 62 ? "Contexte statistique favorable"
        : edge >= 48 ? "Contexte mitigé" : "Contexte statistique hostile";
      const color = edge >= 78 ? "#22c55e" : edge >= 62 ? "#22d3ee" : edge >= 48 ? "#eab308" : "#ef4444";
      return { edge, parts, hurst, entropy, ac1, fd, squeeze: sq, tail, z, absorption: abs_, kelly, blended, verdict, color,
        garch, markov, kalman: kal, hawkes, mc, obRetest: obr, rrPlan };
    }

    function PremiumChart({ candles, plan, dir, digits, livePrice, pairLabel, tfLabel, zones, pipSize }) {

      const wrapRef = useRef(null);

      const clampView = (total) => {

        v.end = Math.max(0, Math.min(total - v.count, Math.round(v.end)));
        if (v.end < 0) v.end = 0;
      };

      // ---- Interactions natives (wheel non-passif obligatoire) ----
      useEffect(() => {
        const cv = canvasRef.current;

        const total = () => (candles || []).length;

      const slPips = Math.abs(entry - sl) / (pipSize || 0.0001);
      const tpPips = Math.abs(tp - entry) / (pipSize || 0.0001);
      const riskUsd = capital * (riskPct / 100);

          const pendingTg = telegramEnabled ? getSignalJournal().filter(s => s.score >= 75 && !s.telegramSent && (s.telegramAttempts || 0) < MAX_SEND_ATTEMPTS) : [];
          for (const s of pendingTg) {

            const all = getSignalJournal();
            const idx = all.findIndex(x => x.id === s.id);
            if (idx !== -1) {
              if (ok) { all[idx].telegramSent = true; }
              else {
                all[idx].telegramAttempts = (all[idx].telegramAttempts || 0) + 1;
                if (all[idx].telegramAttempts >= MAX_SEND_ATTEMPTS) {
                  all[idx].telegramSent = 'failed';
                  console.error('📛 Telegram: abandon après ' + MAX_SEND_ATTEMPTS + ' échecs pour', s.pair, s.timeframe, '— vérifie ton Bot Token / Chat ID.');

        try {
          // Récupération SÉQUENTIELLE, dans le même ordre que le radar affiché

          const orderedIntervals = ["1min", "5min", "15min", "1h", "4h", "1day", "1week"];

                  const rTf = TF_LIST_RADAR.find(t => t.apiInterval === interval);

                    const r = fullAnalysis(p, candlesForTf, rTf, kzNow, customWeights, journal, {}, true);

                      setTfScores(prev => Object.assign({}, prev, { [rTf.id]: entry }));

              }
            } catch(e) {
              resultsByInterval[interval] = null;
            }
            await new Promise(r => setTimeout(r, 20));

          if (signal.aborted || myToken !== loadTokenRef.current) {

          }

          const d1 = resultsByInterval["1day"];
          const w1 = resultsByInterval["1week"];
          const h4 = resultsByInterval["4h"];
          const h1 = resultsByInterval["1h"];
          const m15 = resultsByInterval["15min"];
          const m5 = resultsByInterval["5min"];
          const candles = resultsByInterval[tf.apiInterval];

          if (!candles) { if (myToken === loadTokenRef.current) { setErr("Données principales manquantes"); setLoading(false); loadingRef.current = false; } return; }

          const higher = {};
          if (d1 && d1.length > 20) {
            const d1Closes = d1.map(c => c.close);
            const ema200 = calcEMA(d1Closes, 200);
            higher.daily = { lastClose: d1Closes[d1Closes.length-1], ema200: ema200[ema200.length-1], structure: d1Closes[d1Closes.length-1] > ema200[ema200.length-1] ? 'Haussier' : 'Baissier' };
          }
          if (w1 && w1.length > 20) {
            const w1Closes = w1.map(c => c.close);
            const ema200 = calcEMA(w1Closes, 200);
            higher.weekly = { lastClose: w1Closes[w1Closes.length-1], ema200: ema200[ema200.length-1], structure: w1Closes[w1Closes.length-1] > ema200[ema200.length-1] ? 'Haussier' : 'Baissier' };
          }
          if (h4 && h4.length > 20) {
            const h4Result = analyzeSMC(p, h4, TF_LIST.find(t => t.id === '4h'), {});

          }
          if (h1 && h1.length > 20) {
            const h1Result = analyzeSMC(p, h1, TF_LIST.find(t => t.id === '1h'), {});
            if (h1Result) higher.h1 = h1Result;
          }
          if (m15 && m15.length > 20) {

          if (m5 && m5.length > 20) {

          }

          const result = fullAnalysis(p, candles, tf, kzNow, customWeights, journal, higher, true);
          if (!result) { if (myToken === loadTokenRef.current) { setErr("Données insuffisantes"); setLoading(false); loadingRef.current = false; } return; }
          if (myToken !== loadTokenRef.current) return;
          setCurData(Object.assign({}, result, { candles: candles.slice(-120) }));
          setLastSync(new Date());

          // ---- HOOK AUTO-TRADE : le bot prend la position si le signal est fort ----
          if (autoTradeEnabled && result.plan && result.dir !== "PAS DE TRADE" && result.scoreTotal >= autoTradeMinScore) {
            try { autoOpenTradeRef.current && autoOpenTradeRef.current(p, tf, result, result.plan, result.dir, result.scoreTotal); } catch(e) { console.warn('autoOpenTrade err', e); }
          }


          if (result.scoreTotal >= 60 && result.dir !== "PAS DE TRADE") {
            const signalEntry = {
              pair: p.label,

              dir: result.dir,

              quality: result.quality,

              bos: result.smc.bos,
              choch: result.smc.choch,
              fvgCount: result.smc.fvgCount,
              obCount: result.smc.obsBull.length + result.smc.obsBear.length,
              rsi: result.rsi,
              macd: result.macdHist,
              entryPrice: result.plan ? result.plan.entryA : null,
              slPrice: result.plan ? result.plan.sl : null,
              tp1Price: result.plan ? result.plan.tp1 : null,
              tp2Price: result.plan ? result.plan.tp2 : null,
              tp3Price: result.plan ? result.plan.tp3 : null,
              bePrice: result.plan ? result.plan.be : null,
              trailingStart: result.plan ? result.plan.trailingStart : null,
              isRange: false,
              adx: 25,
              manipulation: result.manipulation,
              volumeProfile: result.volumeProfile,
              cascade: result.cascade,
              liquidity: result.liquidity,
              exchange: result.exchange,
              result: 'pending'
            };
            addSignalToJournal(signalEntry);
            setSignalJournal(getSignalJournal());
          }

          if (result.scoreTotal >= 70 && result.dir !== "PAS DE TRADE") {
            const lastHistory = history.length > 0 ? history[0] : null;
            let shouldLog = true;
            if (lastHistory && lastHistory.pair === p.label && lastHistory.tf === tf.label) {
              if (lastHistory.dir === result.dir && Math.abs(lastHistory.pts - result.scoreTotal) <= 15) {
                shouldLog = false;
              }
            }
            if (shouldLog) {
              const entry = { time: fmtHM(new Date()), pair: p.label, tf: tf.label,
                price: result.live.toFixed(p.digits), dir: result.dir, pts: result.scoreTotal,
                prob: Math.round(result.prob * 100) };
              setHistory(prev => [entry, ...prev].slice(0,10));
            }
          }
          prevScore.current = result.scoreTotal;
          setLoading(false);
          loadingRef.current = false;
        } catch(e) {
          if (myToken !== loadTokenRef.current) return;
          if (e.name !== 'AbortError') setErr(e.message || "Erreur réseau");
          setLoading(false);
          loadingRef.current = false;
        } finally {
          if (currentAbortRef.current === controller) {
            currentAbortRef.current = null;
          }
        }
      }, [customWeights, journal, history]);

      // ---- loadTFRadar avec son propre AbortController ----
      const loadTFRadar = useCallback(async (key, p, kzNow) => {
        if (!key) return;
        if (radarAbortRef.current) radarAbortRef.current.abort();
        const controller = new AbortController();
        radarAbortRef.current = controller;
        const signal = controller.signal;
        // 6 timeframes de la même paire — traités un par un avec micro-pause pour
        // que le tap sur une paire reste fluide au lieu de bloquer l'interface.
        // Chaque score met à jour SON SEUL badge (setTfScores fonctionnel, fusion
        // avec l'état précédent) — les autres badges gardent leur valeur affichée
        // pendant que celui-ci se recalcule, jamais de panneau vide entre-temps.
        for (const tf of TF_LIST_RADAR) {
          if (signal.aborted) break;
          try {
            const candles = await fetchWithCache(p.symbol, tf.apiInterval, key, tf.outputsize, tf.cacheSec, signal);
            if (signal.aborted) break;
            const r = fullAnalysis(p, candles, tf, kzNow, customWeights, journal, {}, true);
            if (r && !signal.aborted) {
              const entry = { total: r.scoreTotal, dir: r.dir, prob: Math.round(r.prob * 100), color: r.sigColor, quality: r.quality || "Pas de trade", ts: Date.now(), args: (r.scoreItems || []).filter(it => it.ok).sort((a,b) => (b.pts||0)-(a.pts||0)).slice(0,3).map(it => it.label) };
              setTfScores(prev => Object.assign({}, prev, { [tf.id]: entry }));
            }
          } catch(e) {}
          await new Promise(r => setTimeout(r, 20));
        }
        if (radarAbortRef.current === controller) radarAbortRef.current = null;
      }, [customWeights, journal]);

      // ---- loadTopPick avec son propre AbortController ----
      const loadTopPick = useCallback(async (key, tf) => {
        if (!key) return;
        if (topPickAbortRef.current) topPickAbortRef.current.abort();
        const controller = new AbortController();
        topPickAbortRef.current = controller;
        const signal = controller.signal;
        const valid = [];
        // Traitement séquentiel (pas Promise.all) : chaque calcul lourd (SMC + Monte
        // Carlo + ML) obtient sa propre "tranche" du thread principal, avec une
        // micro-pause entre chaque paire pour laisser Chrome respirer (scroll/tap
        // restent réactifs au lieu de geler pendant une rafale de calculs groupés).
        for (const p of SCAN_PAIRS) {
          if (signal.aborted) break;
          try {
            const candles = await fetchWithCache(p.symbol, tf.apiInterval, key, tf.outputsize, tf.cacheSec, signal);
            if (signal.aborted) break;
            const result = fullAnalysis(p, candles, tf, activeKZForPair(lomeMin(new Date()), p, new Date()), customWeights, journal, {}, true);
            if (result && result.dir !== "PAS DE TRADE") {
              valid.push({ pair: p, score: result.scoreTotal, dir: result.dir, color: result.sigColor, quality: result.quality });
            }
          } catch(e) {}
          await new Promise(r => setTimeout(r, 25));
        }
        if (signal.aborted) return;
        if (valid.length > 0) {
          valid.sort((a,b) => b.score - a.score);
          setTopPick(valid[0]);
        }
        if (topPickAbortRef.current === controller) topPickAbortRef.current = null;
      }, [customWeights, journal]);

      // ---- scanMarket avec son propre AbortController ----
      const scanMarket = useCallback(async (key) => {
        if (!key) return;
        if (scanAbortRef.current) scanAbortRef.current.abort();
        const controller = new AbortController();
        scanAbortRef.current = controller;
        const signal = controller.signal;
        const opportunities = [];
        const allTFs = TF_LIST.filter(tf => tf.id !== '1week');
        // Le forex est fermé le week-end — inutile (et trompeur) de continuer
        // à scanner ces paires et logger de "nouveaux" signaux sur des
        // bougies figées depuis vendredi. Cryptos/synthétiques restent 24/7.
        const marketClosedNow = !getForexMarketStatus(new Date()).isOpen;
        const scanTargets = marketClosedNow ? SCAN_PAIRS.filter(p => p.type !== 'fx' && p.type !== 'idx') : SCAN_PAIRS;
        const tasks = scanTargets.flatMap(p => allTFs.map(tf => ({ p, tf })));
        // Même correction qu'au-dessus, encore plus critique ici : 42 combinaisons
        // paire×TF traitées une par une avec micro-pause, jamais en rafale groupée.
        for (const { p, tf } of tasks) {
          if (signal.aborted) break;
          try {
            const candles = await fetchWithCache(p.symbol, tf.apiInterval, key, tf.outputsize, tf.cacheSec, signal);
            if (signal.aborted) break;
            const result = fullAnalysis(p, candles, tf, activeKZForPair(lomeMin(new Date()), p, new Date()), customWeights, journal, {}, true);
            if (result && result.dir !== "PAS DE TRADE" && result.scoreTotal >= 45) {
              opportunities.push({
                pair: p.label, pairId: p.id, tf: tf.label, score: result.scoreTotal,
                dir: result.dir, quality: result.quality || "Faible", prob: result.prob, color: result.sigColor
              });
              // Signal fort (≥75) trouvé par le scan marché (pas seulement la paire
              // affichée) → historique en bas du scanner. Anti-doublon : pas plus
              // d'une entrée par paire/TF/sens toutes les 15 minutes.
              if (result.scoreTotal >= 75) {
                const sj = getSignalJournal();
                const recentDup = sj.find(s => s.pair === p.label && s.timeframe === tf.label && s.dir === result.dir && (Date.now() - s.timestamp) < 15 * 60000);
                if (!recentDup && result.plan) {
                  addSignalToJournal({
                    pair: p.label, timeframe: tf.label, timestamp: Date.now(), score: result.scoreTotal,
                    dir: result.dir, prob: result.prob, quality: result.quality, result: 'pending',
                    entryPrice: result.plan.entryA, slPrice: result.plan.sl,
                    tp1Price: result.plan.tp1, tp2Price: result.plan.tp2, tp3Price: result.plan.tp3,
                    bePrice: result.plan.be, trailingStart: result.plan.trailingStart
                  });
                  // ---- AUTO-TRADE pendant le scan multi-paires ----
                  if (autoTradeEnabled && result.scoreTotal >= autoTradeMinScore) {
                    try { autoOpenTradeRef.current && autoOpenTradeRef.current(p, tf, result, result.plan, result.dir, result.scoreTotal); } catch(e) {}
                  }
                }
              }
            }

          } catch(e) {}
          await new Promise(r => setTimeout(r, 25));
        }
        if (!signal.aborted) {
          opportunities.sort((a,b) => b.score - a.score);
          setAllOpportunities(opportunities.slice(0, 15));
        }
        if (scanAbortRef.current === controller) scanAbortRef.current = null;
      }, [customWeights, journal]);

      // ---- Effet principal avec debounce ----
      useEffect(() => {
        if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
        debounceTimerRef.current = setTimeout(() => {
          if (!apiKey || !pair) return;
          if (currentAbortRef.current) currentAbortRef.current.abort();
          if (radarAbortRef.current) radarAbortRef.current.abort();
          if (topPickAbortRef.current) topPickAbortRef.current.abort();
          if (scanAbortRef.current) scanAbortRef.current.abort();
          // On ne vide le radar QUE si la paire ou le timeframe a réellement changé —
          // pas à chaque fois que cet effet se redéclenche (ex: changement de kill
          // zone en arrière-plan). Avant, le panneau se vidait à chaque refresh,
          // même sans action de l'utilisateur — désagréable et donnait une
          // impression de gel/attente. Maintenant les anciennes valeurs restent
          // affichées et se remplacent une par une dès que les nouvelles arrivent.
          const pairTfKey = selPair + '_' + selTF;
          if (prevPairTfKeyRef.current !== pairTfKey) {
            setTfScores({});
            prevScore.current = 0;
            setTopPick(null);
            prevPairTfKeyRef.current = pairTfKey;
          }
          Object.keys(REQUEST_STATUS).forEach(k => clearRequestStatus(k));
          // loadCurrent nourrit maintenant le radar EN DIRECT lui-même, TF par TF,
          // au fur et à mesure de la récupération — plus besoin d'un second passage
          // séparé (loadTFRadar) qui refaisait tout depuis zéro après coup et
          // donnait l'impression que le radar traînait à se remplir.
          const currentLoadPromise = loadCurrent(apiKey, pair, tfConfig, kz);
          // La paire affichée passe en premier, sans concurrence. Le pré-chargement
          // des AUTRES paires (Top Pick + Scan Marché) ne démarre QUE lorsque le
          // chargement de la paire courante est réellement terminé (pas un délai
          // deviné à l'aveugle) — ils ne se battent plus pour le même budget API/CPU.
          if (apiKey && pair && currentLoadPromise && currentLoadPromise.then) {
            currentLoadPromise.then(() => {
              loadTopPick(apiKey, tfConfig);
              scanMarket(apiKey);
            }).catch(() => {});
          }
        }, 150);
        return () => {
          if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
        };
      }, [selPair, selTF, apiKey, loadCurrent, loadTFRadar, loadTopPick, scanMarket, kz, tfConfig, pair]);

      // ---- Rafraîchissement périodique ----
      useEffect(() => {
        if (!apiKey || !pair) return;
        const interval = Math.min(tfConfig.cacheSec * 1000, 300000);
        const t = setInterval(() => {
          if (!apiKey || !pair) return;
          // Marché forex fermé + paire fx/idx → la bougie ne bouge plus, inutile
          // de relancer les calculs (le Monte Carlo interne, basé sur du hasard,
          // ressortait sinon un score légèrement différent à chaque minute alors
          // que rien n'avait vraiment changé).
          if ((pair.type === "fx" || pair.type === "idx") && !getForexMarketStatus(new Date()).isOpen) return;
          loadCurrent(apiKey, pair, tfConfig, kz);
        }, interval);
        return () => clearInterval(t);
      }, [apiKey, pair, tfConfig, kz, loadCurrent]);

      // ---- SMT Divergence : fetch la paire corrélée en tâche de fond,
      //      basse priorité, une seule série (pas de sweep multi-TF) ----
      useEffect(() => {
        if (!apiKey || !curData || !curData.smc) { setSmtDivergence(null); return; }
        const corr = SMT_CORRELATION_MAP[pair.id];
        if (!corr) { setSmtDivergence(null); return; }
        if (smtAbortRef.current) smtAbortRef.current.abort();
        const controller = new AbortController();
        smtAbortRef.current = controller;
        const signal = controller.signal;
        const timeout = setTimeout(() => {
          fetchPriority(corr.symbol, tfConfig.apiInterval, apiKey, tfConfig.outputsize, tfConfig.cacheSec, signal)
            .then(candles => {
              if (signal.aborted || !candles || candles.length < 16) return;
              const correlatedSwings = findSwings(candles.slice(0, -1), 2);
              const divergence = detectSMTDivergence(curData.smc, correlatedSwings);
              setSmtDivergence(divergence ? Object.assign({}, divergence, { correlatedLabel: corr.label }) : null);
            })
            .catch(() => { if (!signal.aborted) setSmtDivergence(null); });
        }, 4000); // décalé après le chargement principal pour rester bas priorité
        return () => { clearTimeout(timeout); controller.abort(); };
      }, [apiKey, pair, tfConfig, curData]);

      // (L'ancien rafraîchissement périodique séparé du radar a été retiré —
      // loadCurrent nourrit désormais le radar lui-même à chaque cycle,
      // TF par TF, donc ce doublon n'a plus lieu d'être.)

      useEffect(() => {
        if (!apiKey) return;
        const timeout = setTimeout(() => loadTopPick(apiKey, tfConfig), 8000);
        const t = setInterval(() => { if (!document.hidden) loadTopPick(apiKey, tfConfig); }, 120000);
        return () => { clearInterval(t); clearTimeout(timeout); };
      }, [apiKey, tfConfig, loadTopPick]);

      useEffect(() => {
        if (!apiKey) return;
        const t = setInterval(() => { if (!document.hidden) scanMarket(apiKey); }, 120000);
        const initial = setTimeout(() => scanMarket(apiKey), 45000);
        return () => { clearInterval(t); clearTimeout(initial); };
      }, [apiKey, scanMarket]);

      useEffect(() => {
        const interval = setInterval(() => { if (!document.hidden) checkAutoClose(); }, 20000);
        return () => clearInterval(interval);
      }, []);

      // ---- Fonctions de trading ----
      function openTrade() {
        if (!curData || !curData.plan || curData.dir === "PAS DE TRADE") { alert("Pas de signal valide."); return; }
        const pending = journal.filter(t => t.pair === pair.label && t.timeframe === tfConfig.label && t.result === 'pending');
        if (pending.length > 0) { alert("Trade déjà en cours sur " + pair.label + " " + tfConfig.label); return; }
        const riskToUse = curData.dynamicRisk || riskPercent;
        // ---- Gestion du risque intelligente : vrais blocages, pas juste des avertissements ----
        const recentPerf = computeRecentPerformance(journal);
        if (recentPerf.dailyBreaker) {
          if (!confirm("🛑 Coupe-circuit journalier atteint (" + recentPerf.todayR.toFixed(1) + "R aujourd'hui). Ouvrir quand même ce trade ?")) return;
        } else if (recentPerf.weeklyBreaker) {
          if (!confirm("🛑 Coupe-circuit hebdomadaire atteint (" + recentPerf.weekR.toFixed(1) + "R cette semaine). Ouvrir quand même ce trade ?")) return;
        }
        const portfolioExposure = computePortfolioExposure(journal, riskCapital);
        if ((portfolioExposure.totalRiskPct + riskToUse) > MAX_PORTFOLIO_RISK_PCT) {
          if (!confirm("⚠️ Ce trade porterait ton exposition totale à " + (portfolioExposure.totalRiskPct + riskToUse).toFixed(1) + "% (plafond: " + MAX_PORTFOLIO_RISK_PCT + "%). Continuer quand même ?")) return;
        }
        // Top 2 critères contributeurs — sert de "type de setup" pour les stats par combo
        const topCriteria = (curData.scoreItems || []).filter(it => it.ok).sort((a,b) => b.pts - a.pts).slice(0, 2).map(it => it.label);
        const dayName = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', timeZone: LOME }).format(new Date());
        const acc0 = getDemoAccount();
        const riskAmount0 = acc0.balance * (riskToUse / 100);
        const trade = {
          pair: pair.label, timeframe: tfConfig.label, direction: curData.dir,
          entryPrice: curData.plan.entryA, slPrice: curData.plan.sl, tp1Price: curData.plan.tp1,
          tp2Price: curData.plan.tp2, tp3Price: curData.plan.tp3, bePrice: curData.plan.be,
          trailingStart: curData.plan.trailingStart, score: curData.scoreTotal,
          proba: Math.round(curData.prob * 100), scores: curData.scoresMap, rMultiple: 2,
          signalId: Date.now(),
          entryTime: Date.now(),
          riskUsed: riskToUse,
          riskAmount: riskAmount0,
          session: kz ? kz.label : "Hors session",
          dayOfWeek: dayName,
          setupType: topCriteria.length > 0 ? topCriteria.join("+") : "Autre",
          auto: false
        };
        const newJournal = addTradeToJournal(trade);
        const tradeId = newJournal[newJournal.length - 1].id;
        if (curData.plan) curData.plan.tradeId = tradeId;
        setJournal(newJournal);
        setStats(calculateStats(newJournal));
        // Notification bot (entrée manuelle)
        const n0 = addBotNotif({
          type: 'entry', pair: pair.label, tf: tfConfig.label, dir: curData.dir,
          entry: curData.plan.entryA, sl: curData.plan.sl, tp: curData.plan.tp1,
          score: curData.scoreTotal, riskUsd: riskAmount0, auto: false,
          msg: '🟢 ENTRÉE MANUELLE ' + curData.dir + ' ' + pair.label + ' @ ' + curData.plan.entryA.toFixed(pair.digits) +
               ' | SL ' + curData.plan.sl.toFixed(pair.digits) + ' | TP ' + curData.plan.tp1.toFixed(pair.digits)
        });
        setBotNotifs(n0);
      }

      // ============================================================
      //  AUTO-TRADE : le bot ouvre lui-même la position
      //  quand un signal dépasse le seuil, avec anti-spam + limite
      //  de positions concurrentes. Affiche une confirmation style bot.
      // ============================================================
      function autoOpenTrade(pObj, tfObj, result, plan, dir, score) {
        if (!autoTradeEnabled) return false;
        if (!pObj || !tfObj || !plan || !result) return false;
        if (score < autoTradeMinScore) return false;
        // Anti-spam : délai configurable entre 2 entrées auto
        const now = Date.now();
        if (now - autoTradeCooldownRef.current < Math.max(8, autoCooldownMin * 60) * 1000) return false;
        // Filtre de probabilité bayésienne
        if (result.prob && result.prob * 100 < autoMinProb) return false;
        // Filtre de timeframe
        if (autoTfFilter !== 'all' && tfObj.label !== autoTfFilter) return false;
        // Session uniquement (killzones)
        if (autoSessionOnly && !kz) return false;
        // Garde news : pas d'entrée à moins de 30 min d'une news à fort impact
        if (autoNewsGuard && news && news.some(n => n.impact === 'high' && Math.abs(new Date(n.time).getTime() - now) < 30 * 60 * 1000)) return false;
        // Quota journalier
        const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
        const todayCount = journal.filter(t => (t.entryTime || t.id) >= startOfDay.getTime()).length;
        if (todayCount >= autoMaxPerDay) return false;
        // Série de pertes consécutives → le bot se met en pause
        const closedDesc = journal.filter(t => t.result === 'win' || t.result === 'loss').slice(-20).reverse();
        let streak = 0;
        for (const t of closedDesc) { if (t.result === 'loss') streak++; else break; }
        if (streak >= autoMaxLossStreak) return false;
        // Un signal ne peut plus être pris s'il date de plus de 10 minutes
        if (result.signalTime && now - result.signalTime > 10 * 60 * 1000) return false;
        // Limite de positions concurrentes
        const openCount = journal.filter(t => t.result === 'pending').length;
        if (openCount >= autoTradeMaxConcurrent) return false;
        // Pas deux fois la même paire+TF
        const dup = journal.find(t => t.pair === pObj.label && t.timeframe === tfObj.label && t.result === 'pending');
        if (dup) return false;
        // Coupe-circuits
        const recentPerf = computeRecentPerformance(journal);
        if (recentPerf.dailyBreaker || recentPerf.weeklyBreaker) return false;
        const riskToUse = result.dynamicRisk || riskPercent;
        const acc = getDemoAccount();
        const riskAmount = acc.balance * (riskToUse / 100);
        const topCriteria = (result.scoreItems || []).filter(it => it.ok).sort((a,b) => b.pts - a.pts).slice(0, 2).map(it => it.label);
        const dayName = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', timeZone: LOME }).format(new Date());
        const trade = {
          pair: pObj.label, timeframe: tfObj.label, direction: dir,
          entryPrice: plan.entryA, slPrice: plan.sl, tp1Price: plan.tp1,
          tp2Price: plan.tp2, tp3Price: plan.tp3, bePrice: plan.be,
          trailingStart: plan.trailingStart, score: score,
          proba: Math.round(result.prob * 100), scores: result.scoresMap, rMultiple: 2,
          signalId: Date.now(),
          entryTime: Date.now(),
          riskUsed: riskToUse,
          riskAmount: riskAmount,
          session: kz ? kz.label : "Hors session",
          dayOfWeek: dayName,
          setupType: topCriteria.length > 0 ? topCriteria.join("+") : "Autre",
          auto: true
        };
        const newJournal = addTradeToJournal(trade);
        const tradeId = newJournal[newJournal.length - 1].id;
        plan.tradeId = tradeId;
        setJournal(newJournal);
        setStats(calculateStats(newJournal));
        autoTradeCooldownRef.current = now;
        // Notification bot (entrée auto) — style Telegram
        const n = addBotNotif({
          type: 'entry', pair: pObj.label, tf: tfObj.label, dir: dir,
          entry: plan.entryA, sl: plan.sl, tp: plan.tp1,
          score: score, riskUsd: riskAmount, auto: true,
          msg: '🤖 ENTRÉE AUTO ' + dir + ' ' + pObj.label + ' @ ' + plan.entryA.toFixed(pObj.digits) +
               ' | SL ' + plan.sl.toFixed(pObj.digits) + ' | TP ' + plan.tp1.toFixed(pObj.digits) +
               ' | Score ' + score.toFixed(0) + 'pts'
        });
        setBotNotifs(n);
        return true;
      }
      // Mise à jour du ref à chaque rendu — loadCurrent/scanMarket liront toujours
      // la version fraîche (avec le dernier autoTradeEnabled, journal, etc.).
      autoOpenTradeRef.current = autoOpenTrade;


      // ============================================================
      //  RÉSOLUTION DES TRADES — helpers manquants réimplémentés
      // ============================================================
      const STALE_EXPIRY_MS = { M1: 6*3600e3, M5: 24*3600e3, M15: 3*24*3600e3, M30: 5*24*3600e3, H1: 7*24*3600e3, H4: 14*24*3600e3, D1: 30*24*3600e3 };
      function getCandlesFor(pObj, tfObj) {
        if (!pObj || !tfObj) return [];
        const c = getCache((pObj.symbol || pObj.id) + '_' + (tfObj.apiInterval || tfObj.id));
        if (Array.isArray(c) && c.length) return c.slice().sort((a, b) => new Date(a.time || a.datetime).getTime() - new Date(b.time || b.datetime).getTime());
        return [];
      }
      function getLatestCandleFor(pObj, tfObj) {
        const arr = getCandlesFor(pObj, tfObj);
        return arr.length ? arr[arr.length - 1] : null;
      }
      const candleTs = c => new Date(c.time || c.datetime).getTime();
      const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : NaN; };

      function closeTradeById(id, result, exitPrice, rMultiple) {
        const j0 = getTradeJournal();
        const t = j0.find(x => x.id === id);
        if (!t || t.result !== 'pending') return;
        updateTradeResult(id, result, exitPrice, rMultiple);
        const risk = t.riskAmount || 0;
        if (result !== 'expired' && risk > 0) adjustDemoBalance(risk * (rMultiple || 0));
        const j = getTradeJournal();
        setJournal(j);
        setStats(calculateStats(j));
        const n = addBotNotif({
          type: result === 'win' ? 'win' : (result === 'loss' ? 'loss' : 'expired'),
          pair: t.pair, tf: t.timeframe, dir: t.direction, entry: t.entryPrice, exit: exitPrice,
          r: rMultiple, pnlUsd: result === 'expired' ? 0 : risk * (rMultiple || 0), auto: !!t.auto,
          msg: (result === 'win' ? '✅ TP ATTEINT ' : result === 'loss' ? '🛑 SL TOUCHÉ ' : '⌛ EXPIRÉ ') +
               t.direction + ' ' + t.pair + ' ' + t.timeframe +
               (result === 'expired' ? '' : ' | ' + (rMultiple > 0 ? '+' : '') + (rMultiple || 0).toFixed(1) + 'R | ' +
                 ((risk * (rMultiple || 0)) >= 0 ? '+$' : '-$') + Math.abs(risk * (rMultiple || 0)).toFixed(2))
        });
        setBotNotifs(n);
      }

      // Résolution honnête : on n'évalue QUE les bougies ouvertes APRÈS
      // l'entrée (sinon la bougie en cours au moment de l'entrée déclenchait
      // un faux TP/SL dans la même minute). SL prioritaire si ambiguïté.
      function resolveOnCandles(fresh, isBuy, levels) {
        for (const c of fresh) {
          const high = num(c.high), low = num(c.low);
          if (!Number.isFinite(high) || !Number.isFinite(low)) continue;
          const slHit = isBuy ? (low <= levels.sl) : (high >= levels.sl);
          if (slHit) return { result: 'loss', price: levels.sl, r: -1 };

              React.createElement("span", { style: { fontSize: "11px", color: "#8b949e", fontWeight: 700 } }, "🔬 Backtest réaliste"),
              React.createElement("button", { onClick: runBacktest, disabled: btRunning || !apiKey,

            ),

              curData && curData.plan && curData.dir !== "PAS DE TRADE" && React.createElement("button", { onClick: openTrade,
                style: { background: "#22d3ee33", border: "1px solid #22d3ee", color: "#22d3ee", borderRadius: "6px", padding: "4px 12px", fontSize: "12px", flex: 1 } }, "📈 Ouvrir trade")

        )
      );
    }

    // ---- Garde-fou anti "écran qui se ferme tout seul" ----
    // Sans limite d'erreur, la moindre exception lancée pendant un rendu
    // (données API inattendues, plan incomplet, canvas indisponible…) fait
    // démonter TOUT l'arbre par React : l'écran devient vide quelques
    // secondes après le chargement. On intercepte désormais l'erreur,
    // on garde l'app affichée et on propose de réessayer.
    class BZBoundary extends React.Component {
      constructor(props) { super(props); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err: err }; }
      componentDidCatch(err, info) { console.error('Blackzeldon boundary:', err, info); }
      render() {
        if (this.state.err) {
          return React.createElement("div", { className: "bz-crash" },
            React.createElement("div", { style: { fontWeight: 700, marginBottom: "4px" } },
              "⚠️ " + (this.props.label || "Un module") + " a rencontré une erreur"),
            React.createElement("div", { style: { fontSize: "11px", opacity: .85 } }, String(this.state.err && this.state.err.message || this.state.err)),
            React.createElement("button", { onClick: () => this.setState({ err: null }) }, "↻ Réessayer")
          );
        }
        return this.props.children;
      }
    }
    window.BZBoundary = BZBoundary;

    var root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(BZBoundary, { label: "Le scanner" }, React.createElement(App)));
    window.__BZ_MOUNTED = true;

  } catch (e) {
    document.getElementById('root').innerHTML = '<div style="background:#1a0a0a;border:2px solid #ef4444;border-radius:12px;padding:20px;color:#ef4444;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;"><strong>❌ Erreur :</strong><br><br>' + e.message + '<br><br>' + (e.stack || '').replace(/\n/g, '<br>') + '</div>';
    console.error('Blackzeldon Error:', e);
  }
}
</script>

<!-- ================== V12 BACKEND MONITOR (heartbeat / clés / diagnostics) ================== -->
<style>
#bzBackend{max-width:500px;margin:0 auto 10px;padding:10px 12px;border-radius:12px;
  background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(5,7,13,.92));border:1px solid rgba(34,211,238,.25);
  font-size:11px;line-height:1.5;}
#bzBackend .bzRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
#bzBackend .bzDot{font-size:12px;}
#bzBackend .bzTag{padding:2px 6px;border-radius:6px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.2);}
#bzBackend .bzMuted{opacity:.7;}
#bzBackend button{min-height:26px;font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(34,211,238,.12);
  color:#67e8f9;border:1px solid rgba(34,211,238,.3);}
#bzBackend .bzList{margin-top:8px;border-top:1px solid rgba(148,163,184,.15);padding-top:6px;}
#bzBackend .bzItem{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-family:ui-monospace,monospace;font-size:10px;}
</style>
<div id="bzBackend">
  <div class="bzRow" style="justify-content:space-between">
    <strong id="bzStatus">⏳ MOTEUR BACKEND — connexion…</strong>
    <button id="bzToggle">▼ Détails</button>
  </div>
  <div class="bzRow bzMuted" id="bzTimes" style="margin-top:4px"></div>
  <div class="bzRow" id="bzKeys" style="margin-top:6px"></div>
  <div id="bzDetails" style="display:none">
    <div class="bzList"><strong>Journal de diagnostic</strong><div id="bzDiag"></div>
      <button id="bzDiagMore" style="margin-top:6px">▼ Voir toute l'activité</button></div>
    <div class="bzList"><strong>Derniers signaux backend</strong><div id="bzSignals"></div>
      <button id="bzSigMore" style="margin-top:6px">▼ Afficher plus</button></div>
  </div>
</div>
<script>
(function(){
  var state=null, diagAll=false, sigAll=false, open=false;
  function ago(iso){ if(!iso) return "—"; var s=Math.round((Date.now()-new Date(iso).getTime())/1000);
    if(s<60) return s+"s"; if(s<3600) return Math.round(s/60)+"min"; return Math.round(s/3600)+"h"; }
  function esc(t){ return String(t==null?"":t).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}); }
  function render(){
    if(!state) return;
    var hb=state.heartbeat||{};
    document.getElementById("bzStatus").innerHTML = state.online
      ? "🟢 BOT ONLINE <span class='bzTag'>"+esc(state.executionMode)+"</span>"
      : "🔴 BOT OFFLINE <span class='bzTag'>backend silencieux</span>";
    document.getElementById("bzTimes").innerHTML =
      "cycle : "+ago(hb.last_cycle_at)+" • donnée : "+ago(hb.last_data_at)+" • signal : "+ago(hb.last_signal_at)+
      " • trade : "+ago(hb.last_trade_at)+" • cycles : "+(hb.cycle_count||0)+
      (hb.last_error?" • <span style='color:#f87171'>erreur : "+esc(hb.last_error).slice(0,60)+"</span>":"");
    document.getElementById("bzKeys").innerHTML = (state.keys||[]).map(function(k){
      var label = !k.configured ? "— non configurée" : (k.available? "● disponible" : "● en pause");
      var col = !k.configured ? "#64748b" : (k.available? "#4ade80" : "#fbbf24");
      return "<span class='bzTag' style='color:"+col+"'>Clé "+k.slot+" : "+label+
        (k.configured? " ("+k.creditsUsed+"/"+k.creditsLimit+")":"")+"</span>";
    }).join("");
    var diag=(state.diagnostics||[]);
    document.getElementById("bzDiag").innerHTML = diag.slice(0, diagAll?60:4).map(function(d){
      return "<div class='bzItem'><span>"+esc(d.event)+(d.symbol?" "+esc(d.symbol):"")+"</span><span class='bzMuted'>"+
        esc((d.reason||"").slice(0,48))+" · "+ago(d.created_at)+"</span></div>";
    }).join("") || "<div class='bzMuted'>Aucune activité enregistrée</div>";
    document.getElementById("bzDiagMore").textContent = diagAll? "▲ Réduire" : "▼ Voir toute l'activité ("+diag.length+")";
    var sigs=(state.signals||[]);
    document.getElementById("bzSignals").innerHTML = sigs.slice(0, sigAll?50:4).map(function(g){
      var fr = g.freshness==="FRESH"?"🟢":g.freshness==="AGING"?"🟡":"🔴";
      return "<div class='bzItem'><span>"+fr+" "+esc(g.symbol)+" "+esc(g.direction)+"</span><span class='bzMuted'>"+
        Math.round(g.score_initial)+"/"+(g.score_confirmation==null?"—":Math.round(g.score_confirmation))+
        " · RR "+(g.rr==null?"—":g.rr)+" · "+esc(g.status)+" · "+ago(g.created_at)+"</span></div>";
    }).join("") || "<div class='bzMuted'>Aucun signal backend pour l'instant</div>";
    document.getElementById("bzSigMore").textContent = sigAll? "▲ Réduire" : "▼ Afficher plus ("+sigs.length+")";
  }
  function load(){
    fetch("/api/public/bz/state",{cache:"no-store"}).then(function(r){return r.json();})
      .then(function(j){ state=j; render(); })
      .catch(function(){ document.getElementById("bzStatus").textContent="🔴 BOT OFFLINE — backend injoignable"; });
  }
  document.getElementById("bzToggle").addEventListener("click",function(){
    open=!open; document.getElementById("bzDetails").style.display= open?"block":"none";
    this.textContent = open? "▲ Masquer" : "▼ Détails"; });
  document.getElementById("bzDiagMore").addEventListener("click",function(){ diagAll=!diagAll; render(); });
  document.getElementById("bzSigMore").addEventListener("click",function(){ sigAll=!sigAll; render(); });
  load(); setInterval(load, 15000);
})();
</script>

<!-- V14.3 — BANDEAU NEWS INTELLIGENT (indépendant de React, zéro coût de rendu) -->
<script>
(function(){
  var el = document.createElement('div');
  el.id = 'bzNewsBanner';
  el.style.cssText = 'display:none;position:sticky;top:0;z-index:9999;padding:8px 12px;font:600 12px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;border-bottom:1px solid #1f2937;background:#0d1220;color:#e5e7eb';
  if (document.body.firstChild) document.body.insertBefore(el, document.body.firstChild);
  else document.body.appendChild(el);

  function esc(t){ return String(t==null?'':t).replace(/[<>&]/g, function(c){ return c==='<'?'&lt;':c==='>'?'&gt;':'&amp;'; }); }
  function nb(v){ return (v===null||v===undefined)?'—':String(v); }

  function render(data){
    var up = (data.upcoming||[]).filter(function(e){ return !e.published; });
    var rec = (data.recent||[]);
    var post = (data.exposure||[]).filter(function(x){ return x.phase === 'POST'; });
    var parts = [];

    if (rec.length) {
      var e = rec[0];
      parts.push('📅 ' + esc(e.event) + ' (' + esc(e.currency) + ') publié : ' + nb(e.actual) +
        ' (prév. ' + nb(e.forecast) + ', préc. ' + nb(e.previous) + ')');
      parts.push('Surprise : ' + (e.surprise===null?'non mesurable':(e.surprise>0?'+':'')+e.surprise) +
        (e.bias ? ' — ' + esc(e.bias) : ''));
      if (post.length) {
        parts.push('⚡ FENÊTRE DE PRUDENCE — ' + post[0].minutes + 'min restantes · devises exposées : ' +
          post.map(function(x){ return esc(x.currency); }).join(', '));
      }
      parts.push('<span style="opacity:.65;font-weight:400">' + esc(e.sourceLabel) + ' · heure Lomé ' + esc(e.localTime) + '</span>');
    } else if (up.length) {
      var u = up[0];
      parts.push('📅 ' + esc(u.event) + ' (' + esc(u.currency) + ') dans ' + u.minutes +
        'min · Impact historique : ' + esc(u.tierLabel));
      parts.push('Prévision : ' + nb(u.forecast) + ' · Précédent : ' + nb(u.previous) +
        ' · ' + esc(u.localTime) + ' (Lomé)');
      parts.push('<span style="opacity:.65;font-weight:400">' + esc(u.sourceLabel) + '</span>');
    }

    var exp = (data.exposure||[]);
    if (exp.length) {
      parts.push('📰 EXPOSITION NEWS ACTIVE — ' + exp.slice(0,4).map(function(x){
        return esc(x.currency) + ' (' + esc(x.event) + (x.phase==='PRE' ? ' dans ' : ' · reste ') + x.minutes + 'min)';
      }).join(' · '));
    }

    var stat = (data.stats||[])[0];
    if (stat && stat.sentence) {
      parts.push('<span style="opacity:.75;font-weight:400">📊 ' + esc(stat.sentence) + '</span>');
    }

    if (!parts.length) { el.style.display = 'none'; return; }
    var alert = rec.length && post.length;
    el.style.background = alert ? '#2a1206' : '#0d1220';
    el.style.borderBottom = '1px solid ' + (alert ? '#b45309' : '#1f2937');
    el.innerHTML = parts.join('<br>');
    el.style.display = 'block';
  }

  function load(){
    if (document.hidden) return;
    fetch('/api/public/bz/news', { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j) render(j); })
      .catch(function(){});
  }
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
